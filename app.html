<script>
// Authentication & Session Context — read from sessionStorage,
// which Login (index.html) populated after a successful login.
// If nothing is there, bounce back to the login page immediately.
var SESSION_TOKEN = sessionStorage.getItem('dphe_auth_token');
var CURRENT_USER = null;
try {
  CURRENT_USER = JSON.parse(sessionStorage.getItem('dphe_user'));
} catch (e) {
  CURRENT_USER = null;
}
if (!SESSION_TOKEN || !CURRENT_USER) {
  window.location.href = 'index.html';
}

// -------------------------------------------------------------
// Global safety net: if ANY promise rejects without being caught
// anywhere in this app, or a plain script error is thrown, show a
// visible banner instead of silently leaving a "Loading..." state
// on screen forever. This is a last line of defense on top of the
// per-view try/catch blocks below.
// -------------------------------------------------------------
function showGlobalErrorBanner(message) {
  var existing = document.getElementById('globalErrorBanner');
  if (existing) existing.remove();
  var banner = document.createElement('div');
  banner.id = 'globalErrorBanner';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#fef2f2;color:#991b1b;border-bottom:2px solid #fca5a5;padding:10px 16px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:12px;';
  banner.innerHTML = '<span>⚠️ Something went wrong: ' + String(message).replace(/[&<>"\']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}) +
    '</span><button type="button" style="background:#991b1b;color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px" onclick="document.getElementById(\'globalErrorBanner\').remove()">Dismiss</button>';
  document.body.prepend(banner);
}
window.addEventListener('unhandledrejection', function(event) {
  var msg = (event.reason && event.reason.message) ? event.reason.message : String(event.reason);
  showGlobalErrorBanner(msg);
});
window.addEventListener('error', function(event) {
  showGlobalErrorBanner(event.message || 'Unknown script error.');
});

// Global DB cache for UI tab navigation
var DB = {
  zones: [], districts: [], users: [], parameters: [], chemicals: [],
  parameterChemicals: [], fiscalYears: [], projects: [], sampleEntries: [],
  privateSampleEntries: []
};

// =============================================================
// Master data: Stale-While-Revalidate via localStorage
// =============================================================
var MASTER_DATA_CACHE_KEY = 'dphe_master_data_v1';

/**
 * Returns master data (fiscalYears, districts, zones, parameters, chemicals,
 * parameterChemicals) as fast as possible.
 *
 * - If a localStorage cache exists it is returned immediately so the UI can
 *   render in the first frame without any network wait.
 * - In the background (or if no cache exists), a single consolidated API call
 *   fetches fresh data from the server and updates the cache for next time.
 */
async function loadMasterData(forceFresh) {
  if (forceFresh) {
    try { localStorage.removeItem(MASTER_DATA_CACHE_KEY); } catch(e) {}
  }
  var cachedRaw = forceFresh ? null : localStorage.getItem(MASTER_DATA_CACHE_KEY);
  var cached = null;
  if (cachedRaw) {
    try { cached = JSON.parse(cachedRaw); } catch(e) { /* ignore corrupt cache */ }
  }

  if (cached) {
    // Serve cache now, refresh in background
    gsr('getAppInitData').then(function(fresh) {
      if (fresh) localStorage.setItem(MASTER_DATA_CACHE_KEY, JSON.stringify(fresh));
    }).catch(function() { /* background refresh failure is non-fatal */ });
    return cached;
  }

  // No cache: fetch fresh (blocking), then store
  const fresh = await gsr('getAppInitData');
  if (fresh) localStorage.setItem(MASTER_DATA_CACHE_KEY, JSON.stringify(fresh));
  return fresh;
}

// Low-level RPC helper — calls the Apps Script Web App with a
// { fn, args } JSON body over POST. "text/plain" content type is
// used deliberately so the browser skips the CORS preflight
// (Apps Script Web Apps can't respond to custom OPTIONS requests).
function apiCall(fnName, args, isRetry) {
  if (!API_URL || API_URL.indexOf('[') === 0) {
    return Promise.reject(new Error('API_URL is not configured. Set it at the top of app.html.'));
  }
  var controller = new AbortController();
  // 50s timeout: Google Apps Script cold-starts can take 20-30s on first execution
  var timeoutId = setTimeout(function() { controller.abort(); }, 50000);

  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fnName, args: args || [] }),
    signal: controller.signal
  })
    .then(function(res) {
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error('Network error: ' + res.status + ' ' + res.statusText);
      return res.json();
    })
    .then(function(json) {
      if (!json.success) throw new Error(json.error || 'Unknown API error.');
      return json.data;
    })
    .catch(function(err) {
      clearTimeout(timeoutId);
      var isTimeout = err && (err.name === 'AbortError' || String(err.message).includes('aborted'));
      var isNetError = err && (err.name === 'TypeError' || String(err.message).includes('Network error') || String(err.message).includes('Failed to fetch'));

      // If the call failed due to cold start timeout or network drop, retry once automatically
      if (!isRetry && (isTimeout || isNetError)) {
        console.warn('API call [' + fnName + '] timed out or network error. Retrying once...', err);
        return apiCall(fnName, args, true);
      }

      if (isTimeout) {
        throw new Error('Server did not respond in time (50 seconds). Please check your internet connection and try again or refresh the page.');
      }
      throw err;
    });
}

// Drop-in replacement for the old google.script.run-based gsr():
// same call signature (gsr('fnName', arg1, arg2, ...)) so none of
// the 40+ call sites elsewhere in this file need to change.
function gsr(fnName, ...args) {
  return apiCall(fnName, [SESSION_TOKEN, ...args]).catch(function(err) {
    var msg = err && err.message ? err.message : String(err);
    if (msg.includes('Session expired') || msg.includes('session has expired') || msg.includes('Please log in')) {
      alert('Your session has expired. Please log in again.');
      handleLogout();
    }
    throw err;
  });
}

function handleLogout() {
  var token = SESSION_TOKEN;
  sessionStorage.removeItem('dphe_auth_token');
  sessionStorage.removeItem('dphe_user');
  // Tell the backend in the background, but don't make the user
  // wait on the network for this — go straight to the login page.
  try {
    apiCall('doLogout', [token]).catch(function() { /* ignore */ });
  } catch (e) { /* ignore */ }
  window.location.href = 'index.html';
}

function openChangePasswordModal() {
  document.getElementById('pwdModalAlert').innerHTML = '';
  document.getElementById('oldPasswordInput').value = '';
  document.getElementById('newPasswordInput').value = '';
  document.getElementById('confirmPasswordInput').value = '';
  document.getElementById('changePasswordModal').classList.add('show');
}

function closeChangePasswordModal() {
  document.getElementById('changePasswordModal').classList.remove('show');
}

function handleChangePasswordSubmit(e) {
  e.preventDefault();
  var oldPass = document.getElementById('oldPasswordInput').value;
  var newPass = document.getElementById('newPasswordInput').value;
  var confirmPass = document.getElementById('confirmPasswordInput').value;
  var alertBox = document.getElementById('pwdModalAlert');
  var btn = document.getElementById('savePwdBtn');

  if (newPass !== confirmPass) {
    alertBox.innerHTML = '<div class="msg error">New passwords do not match.</div>';
    return;
  }

  btn.disabled = true;
  alertBox.innerHTML = '<div class="msg info">Saving password...</div>';

  gsr('changeUserPassword', oldPass, newPass)
    .then(function(res) {
      btn.disabled = false;
      alertBox.innerHTML = '<div class="msg success">' + esc(res.message || 'Password changed successfully!') + '</div>';
      setTimeout(closeChangePasswordModal, 1500);
    })
    .catch(function(err) {
      btn.disabled = false;
      alertBox.innerHTML = '<div class="msg error">' + esc(err.message || 'Error changing password.') + '</div>';
    });
}

function promptResetUserPassword(email) {
  var newPass = prompt('Enter new password for ' + email + ' (Leave blank for default: dphe2025):', 'dphe2025');
  if (newPass === null) return;
  newPass = newPass.trim() || 'dphe2025';
  gsr('adminResetUserPassword', email, newPass)
    .then(function(res) {
      alert('✓ ' + (res.message || 'Password reset successfully!'));
    })
    .catch(function(err) {
      alert('Error: ' + err.message);
    });
}

/* ============ SHARED HELPERS ============ */
function esc(s) {
  return (s === undefined || s === null) ? '' : String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function showMsg(containerEl, text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  containerEl.prepend(div);
  setTimeout(() => div.remove(), 4000);
}
function paramCheckboxList(parameters, name) {
  return `<div class="param-list">` + parameters.map(p =>
    `<label><input type="checkbox" value="${esc(p.ParameterID)}" data-group="${name}"> ${esc(p.ParameterName)} <span style="color:#9ca3af">(${esc(p.Unit)})</span></label>`
  ).join('') + `</div>`;
}
function normId(val) {
  if (val === undefined || val === null) return '';
  const s = String(val).trim().toUpperCase();
  const m = s.match(/^([A-Z]+)0*([0-9]+)$/);
  if (m) {
    const prefix = m[1];
    let num = m[2];
    const padLen = (prefix === 'PC' || prefix === 'PRJ') ? 3 : (prefix === 'SE' ? 4 : 2);
    while (num.length < padLen) {
      num = '0' + num;
    }
    return prefix + num;
  }
  return s;
}

function getCheckedParamIds(formEl, name) {
  return Array.from(formEl.querySelectorAll(`input[data-group="${name}"]:checked`)).map(el => el.value);
}
function paramNamesFromIds(ids, parameters) {
  const map = {};
  (parameters || []).forEach(p => { if (p && p.ParameterID) map[normId(p.ParameterID)] = p.ParameterName; });
  const cleanIds = Array.isArray(ids) ? ids : (typeof ids === 'string' ? parseParamIds(ids) : []);
  return cleanIds.map(id => map[normId(id)] || id).join(', ');
}
function parseParamIds(val) {
  if (!val) return [];
  if (Array.isArray(val)) return val;
  return String(val).split(',').map(s => s.trim()).filter(Boolean);
}
function fyOptions(fiscalYears, selectedId) {
  return fiscalYears.map(fy =>
    `<option value="${esc(fy.FYID)}" ${fy.FYID === selectedId ? 'selected' : ''}>${esc(fy.FYLabel)}${fy.IsActive ? ' (Active)' : ''}</option>`
  ).join('');
}
function confirmDelete(name) {
  return confirm(`Are you sure you want to delete "${name}"? This action cannot be undone.`);
}

/* =====================================================================
   EXEN VIEW
   ===================================================================== */
let EXEN_STATE = { fyId: null, districtId: null, districtName: '', parameters: [], projects: [] };

async function renderExenView() {
  const el = document.getElementById('exenView');
  el.innerHTML = `<div class="loading">Loading...</div>`;

  try {
    const userDistId = String((CURRENT_USER && CURRENT_USER.districtId) || '').trim();
    if (!userDistId) {
      el.innerHTML = `
        <div class="card" style="border-left:4px solid #ef4444;padding:20px">
          <h2 style="color:#dc2626;margin-top:0">⚠️ No District Assigned</h2>
          <p style="color:#4b5563;font-size:14px">
            No district has been assigned to your account <strong>${esc((CURRENT_USER && CURRENT_USER.email) || '')}</strong>.
            Please contact the system administrator to assign your district.
          </p>
          <button type="button" class="btn-sm btn-logout" onclick="handleLogout()">🚪 Logout</button>
        </div>`;
      return;
    }

    // Single API call loads all master data (cached for instant render)
    const initData = await loadMasterData();
    const fiscalYears = initData.fiscalYears || [];
    const districts = initData.districts || [];
    const parameters = initData.parameters || [];

    const myDistrict = districts.find(d => normId(d.DistrictID) === normId(userDistId));
    EXEN_STATE.districtId = myDistrict ? myDistrict.DistrictID : userDistId;
    EXEN_STATE.districtName = myDistrict ? myDistrict.DistrictName : ('District ' + userDistId);
    EXEN_STATE.parameters = parameters;

    const activeFY = fiscalYears.find(f => f.IsActive) || fiscalYears[0];
    EXEN_STATE.fyId = activeFY ? activeFY.FYID : null;

    el.innerHTML = `
      <div class="card">
        <h2>District: ${esc(EXEN_STATE.districtName)}</h2>
        <div class="row">
          <div class="col"><label>Fiscal Year</label><select id="exenFY">${fyOptions(fiscalYears, EXEN_STATE.fyId)}</select></div>
        </div>
      </div>
      <div class="card" id="exenSummaryCard"><div class="loading">Loading summary...</div></div>
      <div class="card">
        <h2>Add Sample Requirement (Project-wise)</h2>
        <p style="font-size:13px;color:#6b7280;margin-bottom:10px">📋 Projects are created by the Admin. Select the project assigned to your district below.</p>
        <div class="row">
          <div class="col"><label>Select Project</label><select id="exenProjectSelect"><option value="">-- Select project --</option></select></div>
        </div>
        <h3>Parameters to test per sample</h3>
        ${paramCheckboxList(parameters, 'exen')}
        <div class="row">
          <div class="col"><label>Expected Number of Samples (this fiscal year)</label><input type="number" id="exenExpectedSamples" min="0" placeholder="e.g. 250"></div>
        </div>
        <label>Remarks (optional)</label><textarea id="exenRemarks"></textarea>
        <button type="button" id="exenSubmitBtn">Save Requirement</button>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h2 style="margin:0">Submitted Entries</h2>
          <button type="button" class="btn-sm" onclick="refreshExenDashboard()" style="background:#f1f5f9;border:1px solid #cbd5e1;cursor:pointer;font-weight:600">🔄 Refresh Data</button>
        </div>
        <div id="exenEntriesTable"><div class="loading">Loading...</div></div>
      </div>
    `;

    document.getElementById('exenFY').addEventListener('change', async e => {
      EXEN_STATE.fyId = e.target.value;
      try {
        await Promise.all([loadExenProjects(), refreshExenDashboard()]);
      } catch (err) {
        alert('Error loading data: ' + (err && err.message ? err.message : err));
      }
    });
    document.getElementById('exenSubmitBtn').addEventListener('click', exenSubmitEntry);

    await Promise.all([loadExenProjects(), refreshExenDashboard()]);
  } catch (err) {
    el.innerHTML = `<div class="msg error">Failed to load: ${esc(err && err.message ? err.message : String(err))}</div>
      <button type="button" onclick="renderExenView()">Retry</button>`;
  }
}

async function loadExenProjects() {
  const projects = await gsr('getProjects', EXEN_STATE.districtId, EXEN_STATE.fyId);
  EXEN_STATE.projects = projects;
  const sel = document.getElementById('exenProjectSelect');
  if (!sel) return;
  sel.innerHTML = `<option value="">-- Select project --</option>` + projects.map(p => `<option value="${esc(p.ProjectID)}">${esc(p.ProjectName)}</option>`).join('');
}

async function exenSubmitEntry() {
  const projectId = document.getElementById('exenProjectSelect').value;
  const expectedSamples = document.getElementById('exenExpectedSamples').value;
  const remarks = document.getElementById('exenRemarks').value;
  const paramIds = getCheckedParamIds(document, 'exen');

  if (!projectId) { alert('Please select a project assigned by Admin.'); return; }
  if (!expectedSamples || Number(expectedSamples) <= 0) { alert('Enter expected number of samples.'); return; }
  if (paramIds.length === 0) { alert('Select at least one parameter.'); return; }

  const btn = document.getElementById('exenSubmitBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await gsr('saveSampleEntry', { fyId: EXEN_STATE.fyId, districtId: EXEN_STATE.districtId, projectId, expectedSamples, parameterIds: paramIds, remarks });
    document.getElementById('exenExpectedSamples').value = '';
    document.getElementById('exenRemarks').value = '';
    document.querySelectorAll('input[data-group="exen"]').forEach(cb => cb.checked = false);
    await refreshExenDashboard();
    showMsg(document.getElementById('exenView'), 'Saved successfully.', 'success');
  } catch (err) {
    showMsg(document.getElementById('exenView'), 'Error: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Requirement';
  }
}

let EXEN_CURRENT_ENTRIES = [];

async function refreshExenDashboard() {
  const card = document.getElementById('exenSummaryCard');
  const tableEl = document.getElementById('exenEntriesTable');
  try {
    const rawData = await gsr('getDistrictDashboard', EXEN_STATE.districtId, EXEN_STATE.fyId);
    if (!card) return;
    const data = (rawData && typeof rawData === 'object') ? rawData : {};
    data.entries = Array.isArray(data.entries) ? data.entries : [];
    data.totalSamples = Number(data.totalSamples) || 0;
    EXEN_CURRENT_ENTRIES = data.entries;

    const sentBackCount = data.entries.filter(e => e.status === 'SENT_BACK').length;
    card.innerHTML = `
      <h2>Fiscal Year Summary</h2>
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${data.totalSamples}</div><div class="lbl">Active Expected Samples (In Calculation)</div></div>
        <div class="stat-box"><div class="num">${data.entries.filter(e => e.status !== 'SENT_BACK').length}</div><div class="lbl">Active Submissions</div></div>
        ${sentBackCount > 0 ? `<div class="stat-box" style="background:#fff1f2;border:1px solid #fecdd3"><div class="num" style="color:#e11d48">${sentBackCount}</div><div class="lbl" style="color:#be123c;font-weight:600">⚠️ Needs Revision (Sent Back by Admin)</div></div>` : ''}
      </div>
    `;
    if (!tableEl) return;
    tableEl.innerHTML = data.entries.length === 0 ? `<div class="empty-state">No entries yet.</div>` : `
      <table>
        <thead>
          <tr>
            <th>Project</th>
            <th>Expected Samples</th>
            <th>Parameters</th>
            <th>Status</th>
            <th>Remarks</th>
            <th>Date</th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody>
          ${data.entries.map(e => {
            const isSentBack = e.status === 'SENT_BACK';
            return `
            <tr id="exen-entry-${esc(e.entryId)}" style="${isSentBack ? 'background:#fff1f2' : ''}">
              <td><strong>${esc(e.projectName)}</strong></td>
              <td style="font-weight:700;font-size:14px;color:${isSentBack ? '#e11d48' : '#0d6efd'}">${esc(e.expectedSamples)}</td>
              <td style="font-size:12px">${esc(paramNamesFromIds(e.parameterIds, EXEN_STATE.parameters))}</td>
              <td>
                ${isSentBack ? `
                  <span class="badge" style="background:#fee2e2;color:#991b1b;font-weight:700;padding:3px 8px">⚠️ Sent Back for Revision</span>
                  <div style="font-size:11px;color:#dc2626;margin-top:3px"><strong>Admin Note:</strong> ${esc(e.sendBackReason || 'Revision needed')}</div>
                  <div style="font-size:10px;color:#64748b;font-style:italic">Excluded from chemical calculation</div>
                ` : `
                  <span class="badge" style="background:#dcfce7;color:#166534;font-weight:600;padding:3px 8px">🔒 Submitted (Locked)</span>
                `}
              </td>
              <td style="font-size:12px;color:#64748b">${esc(e.remarks || '-')}</td>
              <td style="font-size:12px;color:#64748b">${esc(e.enteredAt)}</td>
              <td style="text-align:right">
                ${isSentBack ? `
                  <div class="td-actions" style="justify-content:flex-end">
                    <button type="button" class="btn-sm btn-edit" style="background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;font-weight:600" onclick="editExenEntry('${esc(e.entryId)}')">✏️ Edit & Resubmit</button>
                    <button type="button" class="btn-sm btn-delete" onclick="deleteExenEntry('${esc(e.entryId)}')">🗑️ Discard</button>
                  </div>
                ` : `
                  <span style="font-size:11px;color:#94a3b8;font-style:italic">🔒 Locked (Admin send-back needed)</span>
                `}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  } catch (err) {
    const msg = `<div class="msg error">Failed to load: ${esc(err && err.message ? err.message : String(err))} <button type="button" onclick="refreshExenDashboard()">Retry</button></div>`;
    if (card) card.innerHTML = msg;
    if (tableEl) tableEl.innerHTML = '';
  }
}

function editExenEntry(entryId) {
  const row = document.getElementById('exen-entry-' + entryId);
  const entry = EXEN_CURRENT_ENTRIES.find(e => e.entryId === entryId);
  if (!row || !entry) return;

async function saveExenEntry(entryId) {
  const projectId = document.getElementById('eee-proj-' + entryId).value;
  const expectedSamples = document.getElementById('eee-samples-' + entryId).value;
  const remarks = document.getElementById('eee-remarks-' + entryId).value;
  const paramIds = Array.from(document.querySelectorAll(`.eee-param-cb-${entryId}:checked`)).map(cb => cb.value);

  if (!projectId) { alert('Please select a project.'); return; }
  if (!expectedSamples || Number(expectedSamples) <= 0) { alert('Please enter a valid expected samples number.'); return; }
  if (paramIds.length === 0) { alert('Please select at least one parameter.'); return; }

  try {
    await gsr('updateSampleEntry', entryId, { projectId, expectedSamples, parameterIds: paramIds, remarks });
    await refreshExenDashboard();
    showMsg(document.getElementById('exenView'), 'Entry re-submitted successfully. It is now locked and re-included in chemical calculations.', 'success');
  } catch(err) {
    alert(err.message);
  }
}

async function deleteExenEntry(entryId) {
  if (!confirm('Are you sure you want to cancel/delete this sent back entry?')) return;
  // Optimistic UI: hide immediately, restore on failure
  const row = document.getElementById('exen-entry-' + entryId);
  if (row) row.style.display = 'none';
  try {
    await gsr('deleteSampleEntry', entryId);
    await refreshExenDashboard();
    showMsg(document.getElementById('exenView'), 'Entry discarded successfully.', 'success');
  } catch(err) {
    if (row) row.style.display = '';
    alert(err.message);
  }
}

function extractOtherSpec(typeStr) {
  if (!typeStr || !String(typeStr).startsWith('OTHERS')) return '';
  const match = String(typeStr).match(/^OTHERS\s*\((.*)\)$/i);
  if (match) return match[1].trim();
  const match2 = String(typeStr).match(/^OTHERS\s*[-:]\s*(.*)$/i);
  if (match2) return match2[1].trim();
  return '';
}

function clientBadge(type) {
  const raw = String(type || '').trim();
  if (raw === 'VVIP') return '<span class="badge" style="background:#fef3c7;color:#b45309;font-weight:700">👑 VVIP</span>';
  if (raw === 'CALAMITY_DISASTER' || raw.toLowerCase().includes('calamity') || raw.toLowerCase().includes('disaster')) {
    return '<span class="badge" style="background:#fee2e2;color:#b91c1c;font-weight:700">🚨 Calamity / Disaster</span>';
  }
  if (raw === 'MONITORING_SURVEILLANCE' || raw.toLowerCase().includes('surveillance') || raw.toLowerCase().includes('monitoring')) {
    return '<span class="badge" style="background:#ccfbf1;color:#0f766e;font-weight:700">📡 Monitoring / Surveillance</span>';
  }
  if (raw === 'OTHER_GOVT') return '<span class="badge" style="background:#e0f2fe;color:#0369a1;font-weight:600">🏢 Other Govt.</span>';
  if (raw === 'PRIVATE_ORG') return '<span class="badge" style="background:#ede9fe;color:#6d28d9;font-weight:600">🏢 Private Org.</span>';
  if (raw === 'WALK_IN') return '<span class="badge" style="background:#f1f5f9;color:#475569;font-weight:600">🚶 Walk-in</span>';
  if (raw.startsWith('OTHERS')) {
    const desc = extractOtherSpec(raw);
    return `<span class="badge" style="background:#f3f4f6;color:#374151;font-weight:600">🏷️ Others${desc ? ': ' + esc(desc) : ''}</span>`;
  }
  return `<span class="badge" style="background:#e2e8f0;color:#334155;font-weight:600">${esc(raw || 'Sample')}</span>`;
}

        <button type="button" class="btn-sm btn-cancel" onclick="refreshChemistDashboard()">Cancel</button>

async function savePrivateEntry(entryId) {
  const baseType = document.getElementById('epe-type-' + entryId).value;
  let clientType = baseType;
  if (baseType === 'OTHERS') {
    const specEl = document.getElementById('epe-other-' + entryId);
    const spec = specEl ? specEl.value.trim() : '';
    if (!spec) {
      alert('Please specify the category for Others.');
      if (specEl) specEl.focus();
      return;
    }
    clientType = 'OTHERS (' + spec + ')';
  }

  const clientName = document.getElementById('epe-name-' + entryId).value.trim();
  const expectedSamples = document.getElementById('epe-samples-' + entryId).value;
  const remarks = document.getElementById('epe-remarks-' + entryId).value;
  const paramIds = Array.from(document.querySelectorAll(`.epe-param-cb-${entryId}:checked`)).map(cb => cb.value);

  if (!clientName) { alert('Please enter client / institution name.'); return; }
  if (!expectedSamples || Number(expectedSamples) <= 0) { alert('Please enter a valid expected samples number.'); return; }
  if (paramIds.length === 0) { alert('Please select at least one parameter.'); return; }

  try {
    await gsr('updatePrivateSampleEntry', entryId, { clientType, clientName, expectedSamples, parameterIds: paramIds, remarks });
    await refreshChemistDashboard();
    showMsg(document.getElementById('chemistView'), 'Sample re-submitted successfully. It is now locked and re-included in chemical calculations.', 'success');
  } catch(err) {
    alert(err.message);
  }
}

async function deletePrivateEntry(entryId) {
  if (!confirm('Are you sure you want to cancel/delete this sent back private entry?')) return;
  // Optimistic UI: hide immediately, restore on failure
  const row = document.getElementById('priv-entry-' + entryId);
  if (row) row.style.display = 'none';
  try {
    await gsr('deletePrivateSampleEntry', entryId);
    await refreshChemistDashboard();
    showMsg(document.getElementById('chemistView'), 'Entry discarded successfully.', 'success');
  } catch(err) {
    if (row) row.style.display = '';
    alert(err.message);
  }
}

async function privSubmitEntry() {
  const baseType = document.getElementById('privClientType').value;
  let clientType = baseType;
  if (baseType === 'OTHERS') {
    const otherInp = document.getElementById('privOtherSpecify');
    const spec = otherInp ? otherInp.value.trim() : '';
    if (!spec) {
      alert('Please specify the category for Others.');
      if (otherInp) otherInp.focus();
      return;
    }
    clientType = 'OTHERS (' + spec + ')';
  }

  const clientName = document.getElementById('privClientName').value.trim();
  const expectedSamples = document.getElementById('privExpectedSamples').value;
  const remarks = document.getElementById('privRemarks').value;
  const paramIds = getCheckedParamIds(document, 'priv');

  if (!clientName) { alert('Enter client / institution name.'); return; }
  if (!expectedSamples || Number(expectedSamples) <= 0) { alert('Enter expected number of samples.'); return; }
  if (paramIds.length === 0) { alert('Select at least one parameter.'); return; }

  const btn = document.getElementById('privSubmitBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await gsr('savePrivateSampleEntry', { fyId: CHEMIST_STATE.fyId, zoneId: CHEMIST_STATE.zoneId, clientType, clientName, expectedSamples, parameterIds: paramIds, remarks });
    document.getElementById('privClientName').value = '';
    document.getElementById('privExpectedSamples').value = '';
    document.getElementById('privRemarks').value = '';
    if (document.getElementById('privOtherSpecify')) document.getElementById('privOtherSpecify').value = '';
    togglePrivOtherField();
    document.querySelectorAll('input[data-group="priv"]').forEach(cb => cb.checked = false);
    showMsg(document.getElementById('chemistView'), 'Saved successfully.', 'success');
    await refreshChemistDashboard();
  } catch (err) {
    showMsg(document.getElementById('chemistView'), 'Error: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Sample';
  }
}

let ADMIN_ACTIVE_TAB = 'zones';

async function renderAdminView(forceRefresh) {
  const el = document.getElementById('adminView');

  try {
    if (forceRefresh || !window.DB || !window.DB.zones) {
      el.innerHTML = `<div class="loading">Loading...</div>`;
      data = await gsr('getAdminBootstrap');
      // Defensive: ensure all expected arrays are always present
      if (!data || typeof data !== 'object') data = {};
      data.zones              = Array.isArray(data.zones)              ? data.zones              : [];
      data.districts          = Array.isArray(data.districts)          ? data.districts          : [];
      data.users              = Array.isArray(data.users)              ? data.users              : [];
      data.parameters         = Array.isArray(data.parameters)         ? data.parameters         : [];
      data.chemicals          = Array.isArray(data.chemicals)          ? data.chemicals          : [];
      data.parameterChemicals = Array.isArray(data.parameterChemicals) ? data.parameterChemicals : [];
      data.fiscalYears        = Array.isArray(data.fiscalYears)        ? data.fiscalYears        : [];
      data.projects           = Array.isArray(data.projects)           ? data.projects           : [];
      data.sampleEntries      = Array.isArray(data.sampleEntries)      ? data.sampleEntries      : [];
      data.privateSampleEntries = Array.isArray(data.privateSampleEntries) ? data.privateSampleEntries : [];

    return;
  }

  let htmlContent;
  try {
    htmlContent = `
    <div class="tabs" id="adminTabs">
      <button type="button" class="tab-btn ${ADMIN_ACTIVE_TAB==='zones'?'active':''}" data-tab="zones">Zones</button>
      <button type="button" class="tab-btn ${ADMIN_ACTIVE_TAB==='districts'?'active':''}" data-tab="districts">Districts</button>

      <button type="button" class="tab-btn ${ADMIN_ACTIVE_TAB==='submissions'?'active':''}" data-tab="submissions">📊 Submissions</button>
      <button type="button" class="tab-btn ${ADMIN_ACTIVE_TAB==='params'?'active':''}" data-tab="params">Parameters</button>
      <button type="button" class="tab-btn ${ADMIN_ACTIVE_TAB==='chemicals'?'active':''}" data-tab="chemicals">🧪 Chemicals</button>
      <button type="button" class="tab-btn ${ADMIN_ACTIVE_TAB==='recipe'?'active':''}" data-tab="recipe">Chemical Recipe</button>
      <button type="button" class="tab-btn ${ADMIN_ACTIVE_TAB==='fy'?'active':''}" data-tab="fy">Fiscal Years</button>
      <button type="button" class="tab-btn ${ADMIN_ACTIVE_TAB==='backup'?'active':''}" data-tab="backup">💾 Excel Setup &amp; Backup</button>
    </div>
    ${renderZonesTab(data)}
    ${renderDistrictsTab(data)}
    ${renderUsersTab(data)}
    ${renderProjectsTab(data)}
    ${renderSubmissionsTab(data)}
    ${renderParamsTab(data)}
    ${renderChemicalsTab(data)}
    ${renderRecipeTab(data)}
    ${renderFYTab(data)}
    ${renderBackupTab(data)}
  `;
  } catch (renderErr) {
    el.innerHTML = `<div class="msg error">Page render error: ${esc(renderErr && renderErr.message ? renderErr.message : String(renderErr))}</div>
      <button type="button" onclick="renderAdminView(true)">Retry</button>`;
    console.error('renderAdminView render error:', renderErr);
    return;
  }
  el.innerHTML = htmlContent;


  // Tabs switching
  el.querySelectorAll('#adminTabs .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      ADMIN_ACTIVE_TAB = btn.dataset.tab;
      el.querySelectorAll('#adminTabs .tab-btn').forEach(b => b.classList.remove('active'));

  bindSubmissionsTab(data);
  bindParamsTab(data);
  bindChemicalsTab(data);

  bindFYTab(data);
  bindBackupTab(data);
}

/* ======= PROJECTS TAB (Admin) ======= */
function formatProjectDistricts(p, distMap) {
  if (p.IsAllDistricts || p.DistrictID === 'ALL' || (Array.isArray(p.DistrictIDs) && p.DistrictIDs.includes('ALL'))) {
    return `<span class="badge" style="background:#dcfce7;color:#166534;font-weight:600;font-size:12px;padding:3px 8px">🌐 All Districts</span>`;
  }
  let ids = [];
  if (Array.isArray(p.DistrictIDs)) ids = p.DistrictIDs;
  else if (p.DistrictID) ids = p.DistrictID.split(',').map(s => s.trim()).filter(Boolean);

  if (ids.length === 0) {
    return `<span style="color:#ef4444;font-style:italic">None</span>`;
  }
  const names = ids.map(id => distMap[id] || id);
  if (ids.length <= 3) {
    return `<span class="badge govt" style="margin-right:4px">${ids.length} Districts:</span> <span style="font-size:12px;color:#334155">${esc(names.join(', '))}</span>`;
  }
  const preview = names.slice(0, 3).join(', ');
  return `<span class="badge govt" style="margin-right:4px" title="${esc(names.join(', '))}">📍 ${ids.length} Districts:</span> <span style="font-size:12px;color:#334155">${esc(preview)}</span> <span style="font-size:11px;color:#64748b;font-weight:500">+${ids.length - 3} more</span>`;
}

function renderDistrictSelector(prefix, selectedDistIds = [], isAll = true) {

        <input type="checkbox" class="${prefix}-dist-cb" value="${esc(d.DistrictID)}" ${checked ? 'checked' : ''} onchange="updateProjectDistCount('${prefix}')" style="margin:0;width:auto">

    <div style="margin:10px 0 14px 0;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px">

        <label style="cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;margin-bottom:0">

      </div>

      <div id="${prefix}-all-notice" style="display:${isAll ? 'block' : 'none'};background:#e0f2fe;border:1px solid #bae6fd;color:#0369a1;padding:10px 14px;border-radius:6px;font-size:13px">
        <strong>✓ All-Districts Project:</strong> This project will be available in the dropdown for EXENs of all ${DB.districts.length} districts. No need to select individual districts.
      </div>

      <div id="${prefix}-dist-picker" style="display:${isAll ? 'none' : 'block'};margin-top:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
          <input type="text" id="${prefix}-dist-search" placeholder="🔍 Search district or zone..."

          <div style="display:flex;gap:8px;align-items:center">
            <button type="button" class="btn-sm secondary" onclick="bulkCheckDistricts('${prefix}', true)">✓ Select All (${DB.districts.length})</button>
            <button type="button" class="btn-sm secondary" onclick="bulkCheckDistricts('${prefix}', false)">✕ Deselect All</button>
          </div>
        </div>
        <div id="${prefix}-dist-grid" style="max-height:190px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));gap:6px;background:#f1f5f9;padding:8px;border:1px solid #cbd5e1;border-radius:6px">
          ${distCheckboxes}
        </div>
        <div style="font-size:12px;font-weight:600;color:#0369a1;margin-top:6px" id="${prefix}-selected-count">
          ${!isAll ? selectedDistIds.length + ' districts selected' : ''}
        </div>
      </div>
    </div>`;
}

function toggleProjectScope(prefix) {
  const scopeEl = document.querySelector(`input[name="${prefix}-scope"]:checked`);
  const scope = scopeEl ? scopeEl.value : 'ALL';
  const allNotice = document.getElementById(`${prefix}-all-notice`);
  const distPicker = document.getElementById(`${prefix}-dist-picker`);
  if (scope === 'ALL') {
    if (allNotice) allNotice.style.display = 'block';
    if (distPicker) distPicker.style.display = 'none';
  } else {
    if (allNotice) allNotice.style.display = 'none';
    if (distPicker) distPicker.style.display = 'block';
    updateProjectDistCount(prefix);
  }
}

function bulkCheckDistricts(prefix, check) {
  const cbs = document.querySelectorAll(`.${prefix}-dist-cb`);
  cbs.forEach(cb => {
    const parent = cb.closest('.proj-dist-item');
    if (!parent || parent.style.display !== 'none') {
      cb.checked = check;
    }
  });
  updateProjectDistCount(prefix);
}

function filterProjectDistricts(prefix) {
  const searchEl = document.getElementById(`${prefix}-dist-search`);
  const q = (searchEl ? searchEl.value : '').toLowerCase().trim();
  const items = document.querySelectorAll(`#${prefix}-dist-grid .proj-dist-item`);
  items.forEach(item => {
    const name = item.dataset.name || '';
    const zone = item.dataset.zone || '';
    item.style.display = (!q || name.includes(q) || zone.includes(q)) ? 'flex' : 'none';
  });
}

function updateProjectDistCount(prefix) {
  const countEl = document.getElementById(`${prefix}-selected-count`);
  if (!countEl) return;
  const checked = document.querySelectorAll(`.${prefix}-dist-cb:checked`).length;
  countEl.textContent = `✓ ${checked} district(s) selected`;
}

function getProjectScopeData(prefix) {
  const scopeEl = document.querySelector(`input[name="${prefix}-scope"]:checked`);
  const scope = scopeEl ? scopeEl.value : 'ALL';
  if (scope === 'ALL') return ['ALL'];
  return Array.from(document.querySelectorAll(`.${prefix}-dist-cb:checked`)).map(cb => cb.value);
}

function renderProjectsTab(data) {
  const distMap = {}; data.districts.forEach(d => distMap[d.DistrictID] = d.DistrictName);
  const fyMap = {}; data.fiscalYears.forEach(f => fyMap[f.FYID] = f.FYLabel);
  const activeFY = data.fiscalYears.find(f => f.IsActive) || data.fiscalYears[0] || {};

  const rows = (data.projects || []).map(p => `

      <td><div class="td-actions">
        <button class="btn-sm btn-edit" onclick="editProjectRow('${esc(p.ProjectID)}')">Edit</button>

function editProjectRow(id) {
  const row = document.getElementById('proj-row-' + id);
  const p = DB.projects.find(x => x.ProjectID === id);
  if (!row || !p) return;

  const isAll = p.IsAllDistricts || p.DistrictID === 'ALL' || (Array.isArray(p.DistrictIDs) && p.DistrictIDs.includes('ALL'));
  let selectedIds = [];
  if (!isAll) {
    if (Array.isArray(p.DistrictIDs)) selectedIds = p.DistrictIDs;
    else if (p.DistrictID) selectedIds = p.DistrictID.split(',').map(s => s.trim()).filter(Boolean);
  }

  row.classList.add('editing');
  row.innerHTML = `
    <td colspan="4" style="background:#fffbeb;padding:16px;border:2px solid #f59e0b;border-radius:8px">
      <div style="font-weight:700;margin-bottom:12px;color:#92400e;font-size:14px">✏️ Edit Project: ${esc(p.ProjectName)}</div>
      <div class="row">
        <div class="col" style="flex:2"><label>Project Name</label><input type="text" value="${esc(p.ProjectName)}" id="epr-name-${esc(id)}"></div>
        <div class="col"><label>Fiscal Year</label><select id="epr-fy-${esc(id)}">${fyOptions(DB.fiscalYears, p.FYID)}</select></div>
      </div>
      ${renderDistrictSelector('edit-' + id, selectedIds, isAll)}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
        <button class="btn-sm btn-save" onclick="saveProject('${esc(id)}')">💾 Save Changes</button>
        <button class="btn-sm btn-cancel" onclick="renderAdminView()">Cancel</button>
      </div>
    </td>`;
}

async function saveProject(id) {
  const name = document.getElementById('epr-name-' + id).value.trim();
  const fyId = document.getElementById('epr-fy-' + id).value;
  if (!name) { alert('Please enter a project name.'); return; }
  const distIds = getProjectScopeData('edit-' + id);
  if (distIds.length === 0) { alert('Please select at least one district or choose All Districts.'); return; }
  await gsr('adminUpdateProject', id, name, distIds, fyId);
  renderAdminView(true);
}

async function deleteProject(id, name) {
  if (!confirmDelete(name)) return;
  await gsr('adminDeleteProject', id);
  renderAdminView(true);
}

function bindProjectsTab(data) {
  document.getElementById('addProjBtn').addEventListener('click', async () => {
    const name = document.getElementById('newProjName').value.trim();
    const fyId = document.getElementById('newProjFY').value;

    const distIds = getProjectScopeData('new');
    if (distIds.length === 0) { alert('Please select at least one district or choose All Districts.'); return; }
    await gsr('adminAddProject', name, distIds, fyId);

  });
}

function renderSubmissionsTab(data) {
  const distMap = {}; data.districts.forEach(d => distMap[d.DistrictID] = d.DistrictName);

  const paramMap = {}; data.parameters.forEach(p => paramMap[p.ParameterID] = p.ParameterName);

  // Government / District submissions (from EXEN)
  const govtEntries = (data.sampleEntries || []).map(e => ({
    entryId: e.EntryID,
    isPrivate: false,

    expectedSamples: Number(e.ExpectedSamples) || 0,
    parameterIds: parseParamIds(e.ParameterIDs),
    remarks: e.Remarks || '',
    status: e.Status || 'SUBMITTED',
    sendBackReason: e.SendBackReason || '',

    enteredAt: e.EnteredAt || ''

  // Private sample submissions (from Chemist)
  const privEntries = (data.privateSampleEntries || []).map(e => ({

              <select id="submFilterStatus" onchange="filterAdminSubmissions()">
                <option value="">-- All Statuses --</option>
                <option value="SUBMITTED">🔒 Submitted (Active)</option>
                <option value="SENT_BACK">⚠️ Sent Back (Excluded)</option>
              </select>
            </div>
            <div class="col" style="flex:1.5">
              <label>Search (Project, Client, District, User, Remarks)</label>

// Pagination state for submissions
window._adminSubmAllRows = window._adminSubmAllRows || [];
window._adminSubmCurrentPage = window._adminSubmCurrentPage || 1;
var ADMIN_SUBM_ROWS_PER_PAGE = 20;

function renderSubmissionsPage(rows, page) {
  const tbody = document.getElementById('adminSubmTbody');
  const pagination = document.getElementById('adminSubmPagination');
  if (!tbody) return;

  const totalPages = Math.max(1, Math.ceil(rows.length / ADMIN_SUBM_ROWS_PER_PAGE));
  page = Math.min(Math.max(1, page), totalPages);
  window._adminSubmCurrentPage = page;

  const start = (page - 1) * ADMIN_SUBM_ROWS_PER_PAGE;
  const pageRows = rows.slice(start, start + ADMIN_SUBM_ROWS_PER_PAGE);

  const fragment = document.createDocumentFragment();
  const wrapper = document.createElement('tbody');
  wrapper.innerHTML = pageRows.length
    ? pageRows.join('')
    : '<tr><td colspan="9" style="text-align:center;padding:16px;color:#94a3b8">No submitted entries found.</td></tr>';
  Array.from(wrapper.children).forEach(tr => fragment.appendChild(tr));

  tbody.innerHTML = '';
  tbody.appendChild(fragment);

  // Pagination controls
  if (pagination) {
    if (totalPages <= 1) { pagination.innerHTML = ''; return; }
    let btns = `<span style="font-size:13px;color:#64748b">Page ${page} of ${totalPages}</span>`;
    if (page > 1) btns = `<button type="button" class="btn-sm ghost" onclick="renderSubmissionsPage(window._adminSubmVisibleRows||window._adminSubmAllRows,${page-1})">‹ Prev</button>` + btns;
    if (page < totalPages) btns += `<button type="button" class="btn-sm ghost" onclick="renderSubmissionsPage(window._adminSubmVisibleRows||window._adminSubmAllRows,${page+1})">Next ›</button>`;
    pagination.innerHTML = btns;
  }
}

function filterAdminSubmissions() {
  const distVal = (document.getElementById('submFilterDistrict') || {}).value || '';
  const fyVal = (document.getElementById('submFilterFY') || {}).value || '';
  const typeVal = (document.getElementById('submFilterType') || {}).value || '';
  const statusVal = (document.getElementById('submFilterStatus') || {}).value || '';
  const q = ((document.getElementById('submFilterKeyword') || {}).value || '').toLowerCase().trim();

  // Filter from the raw HTML rows array using simple string matching on data attributes
  const allRows = window._adminSubmAllRows || [];
  const filtered = allRows.filter(rowHtml => {
    const dMatch = !distVal || rowHtml.includes('data-district="' + distVal + '"');
    const fyMatch = !fyVal || rowHtml.includes('data-fy="' + fyVal + '"');
    const typeMatch = !typeVal || rowHtml.includes('data-type="' + typeVal + '"');
    const statusMatch = !statusVal || rowHtml.includes('data-status="' + statusVal + '"');
    const qMatch = !q || rowHtml.toLowerCase().includes(q);
    return dMatch && fyMatch && typeMatch && statusMatch && qMatch;
  });

  window._adminSubmVisibleRows = filtered;

async function openSendBackPrompt(entryId) {
  const reason = prompt('Specify the reason for sending back this submission (e.g. verify sample count / correct parameters):', 'Returned by Admin for correction.');
  if (reason === null) return;
  if (!reason.trim()) {
    alert('Please enter a reason for sending back.');
    return;
  }

  const cleanReason = reason.trim();

  // Optimistic UI: update local DB immediately
  if (window.DB) {
    const g = (window.DB.sampleEntries || []).find(e => e.EntryID === entryId);
    if (g) { g.Status = 'SENT_BACK'; g.SendBackReason = cleanReason; }
    const p = (window.DB.privateSampleEntries || []).find(e => e.EntryID === entryId);
    if (p) { p.Status = 'SENT_BACK'; p.SendBackReason = cleanReason; }
  }

  // Immediate DOM update so Admin sees action take effect instantly
  const row = document.getElementById('admin-subm-row-' + entryId);
  if (row) {
    row.dataset.status = 'SENT_BACK';
    if (row.cells[4]) {
      row.cells[4].innerHTML = `<div>
        <span class="badge" style="background:#fee2e2;color:#991b1b;font-weight:600;padding:3px 8px">⚠️ Sent Back (Excluded)</span>
        <div style="font-size:11px;color:#dc2626;margin-top:3px"><strong>Reason:</strong> ${esc(cleanReason)}</div>
      </div>`;
    }
    if (row.cells[8]) {
      row.cells[8].innerHTML = `<div class="td-actions" style="flex-direction:column;align-items:stretch;gap:4px">
        <span class="badge" style="background:#fee2e2;color:#991b1b;font-weight:600;padding:5px 8px;font-size:11px;text-align:center">
          ↩️ With User<br><span style="font-size:10px;font-weight:400;color:#7f1d1d">Pending User Revision</span>
        </span>
      </div>`;
    }
  }

  try {
    await gsr('adminSendBackEntry', entryId, cleanReason);
    ADMIN_ACTIVE_TAB = 'submissions';
    await renderAdminView(true);
    alert('The entry has been returned (Sent Back) to the user successfully. It is now excluded from calculations and with the user for revision.');
  } catch(err) {
    alert('Error: ' + err.message);
    await renderAdminView(true);
  }
}

async function saveRecipe(rowId) {
  const paramId = document.getElementById('er-param-' + rowId).value;
  const chemId = document.getElementById('er-chem-' + rowId).value;
  const qty = document.getElementById('er-qty-' + rowId).value;
  if (!qty) return;
  // Unit always comes from master chemical

  }

  const alertBox = document.getElementById('sanitizeResultAlert');
  if (btn) btn.disabled = true;
  if (spinner) spinner.style.display = 'inline-block';
  if (alertBox) alertBox.style.display = 'none';

  try {
    const res = await gsr('adminSanitizeAllIDs');
    if (res && res.success) {
      let detailHtml = '<ul style="margin:8px 0 0 16px;padding:0;font-size:12px;color:#1e3a8a;line-height:1.6">';
      const details = res.details || {};
      for (const [sheet, info] of Object.entries(details)) {
        detailHtml += `<li><strong>${esc(sheet)}:</strong> Checked ${info.rowsChecked || 0} rows | Updated ${info.cellsUpdated || 0} cells</li>`;
      }
      detailHtml += '</ul>';

      if (alertBox) {
        alertBox.className = 'msg success';
        alertBox.style.display = 'block';
        alertBox.innerHTML = `<div><strong>✓ Sanitization completed successfully!</strong> A total of <strong>${res.totalCellsUpdated || 0}</strong> cell IDs were updated to standard format and cache refreshed.</div>${detailHtml}`;
      }
      window.DB = null;
      await renderAdminView(true);
    } else {
      throw new Error(res && res.error ? res.error : 'Sanitization failed.');
    }
  } catch (err) {
    if (alertBox) {
      alertBox.className = 'msg error';
      alertBox.style.display = 'block';
      alertBox.innerHTML = `⚠️ Error: ${esc(err && err.message ? err.message : String(err))}`;
    }
  } finally {
    if (btn) btn.disabled = false;
    if (spinner) spinner.style.display = 'none';
  }
}

// -------------------------------------------------------------
// Smart Entity Resolver & Batch ID Generator for Excel Setup
// -------------------------------------------------------------
function createBatchIdAssigner(existingItems, idField, prefix, padLength) {
  padLength = padLength || 2;
  let maxNum = 0;
  (existingItems || []).forEach(item => {
    const val = String((item && item[idField]) || '').trim();
    if (val.toUpperCase().indexOf(prefix.toUpperCase()) === 0) {
      const num = parseInt(val.substring(prefix.length), 10);
      if (!isNaN(num) && num > maxNum) maxNum = num;
    }
  });
  let counter = maxNum;
  return {
    register: function(id) {
      if (!id) return;
      const val = String(id).trim().toUpperCase();
      if (val.indexOf(prefix.toUpperCase()) === 0) {
        const num = parseInt(val.substring(prefix.length), 10);
        if (!isNaN(num) && num > counter) counter = num;
      }
    },
    next: function() {
      counter += 1;
      let numStr = String(counter);
      while (numStr.length < padLength) numStr = '0' + numStr;
      return prefix + numStr;
    }
  };
}

function findWorkbookSheet(wb, sheetAliases) {
  const wbNames = Object.keys((wb && wb.Sheets) || {});
  for (const a of sheetAliases) {
    const target = a.trim().toLowerCase();
    const found = wbNames.find(s => s.trim().toLowerCase() === target);
    if (found) return wb.Sheets[found];
  }
  return null;
}

function getSheetCleanRows(wb, sheetAliases) {
  const ws = findWorkbookSheet(wb, sheetAliases);
  if (!ws) return null;
  const rawRows = XLSX.utils.sheet_to_json(ws, { defval: '' });
  if (!rawRows || rawRows.length === 0) return [];
  return rawRows.map(row => {
    const clean = {};
    for (const k in row) {
      if (Object.prototype.hasOwnProperty.call(row, k)) {
        clean[k.trim()] = typeof row[k] === 'string' ? row[k].trim() : row[k];
      }
    }
    return clean;
  });
}

function getRowValue(row, aliases) {
  const keys = Object.keys(row || {});
  for (const a of aliases) {
    const targetKey = a.toLowerCase().replace(/[^a-z0-9]/g, '');
    for (const k of keys) {
      if (k.toLowerCase().replace(/[^a-z0-9]/g, '') === targetKey) {
        const val = row[k];
        if (val !== undefined && val !== null && String(val).trim() !== '') {
          return String(val).trim();
        }
      }
    }
  }
  return '';
}

  const btn = document.getElementById('executeExcelImportBtn');
  const originalBtnText = btn ? btn.innerHTML : '';

  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '🔄 Processing Excel sheets...';
      }

      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const counts = [];
      const warnings = [];
      const isReplace = mode === 'replace';
      const curDB = window.DB || {};

      // Seed lookups from current DB if merging or available
      const zoneLookup = {};
      (curDB.zones || []).forEach(z => {
        const zid = normId(z.ZoneID);
        zoneLookup[zid] = zid;
        if (z.ZoneName) {
          const zn = z.ZoneName.toLowerCase().trim();
          zoneLookup[zn] = zid;
          zoneLookup[zn.replace(/zone\s*/i, '').trim()] = zid;
        }
      });

      const districtLookup = {};
      (curDB.districts || []).forEach(d => {
        const did = normId(d.DistrictID);
        districtLookup[did] = did;
        if (d.DistrictName) districtLookup[d.DistrictName.toLowerCase().trim()] = did;
      });

      const paramLookup = {};
      (curDB.parameters || []).forEach(p => {
        const pid = normId(p.ParameterID);
        paramLookup[pid] = pid;
        if (p.ParameterName) {
          const pn = p.ParameterName.toLowerCase().trim();
          paramLookup[pn] = pid;
          paramLookup[pn.replace(/\s*\([^)]*\)/g, '').trim()] = pid;
        }
      });

      const chemLookup = {};
      const chemUnitMap = {};
      (curDB.chemicals || []).forEach(c => {
        const cid = normId(c.ChemicalID);
        chemLookup[cid] = cid;
        if (c.ChemicalName) chemLookup[c.ChemicalName.toLowerCase().trim()] = cid;
        chemUnitMap[cid] = c.Unit || '';
      });

      const fyLookup = {};
      (curDB.fiscalYears || []).forEach(fy => {
        const fid = normId(fy.FYID);
        fyLookup[fid] = fid;
        if (fy.FYLabel) fyLookup[fy.FYLabel.toLowerCase().trim()] = fid;
      });

      // ================= PASS 1: INDEPENDENT ENTITIES =================

      // 1. ZONES
      const zonesRows = getSheetCleanRows(workbook, ['Zones', 'Zone']);
      let cleanedZones = null;
      if (zonesRows && zonesRows.length > 0) {
        cleanedZones = [];
        const zoneAssigner = createBatchIdAssigner(isReplace ? [] : curDB.zones, 'ZoneID', 'Z', 2);
        zonesRows.forEach(r => {
          const rawId = getRowValue(r, ['ZoneID', 'ID', 'Zone_ID']);
          if (rawId) zoneAssigner.register(normId(rawId));
        });
        zonesRows.forEach(r => {
          const rawId = getRowValue(r, ['ZoneID', 'ID', 'Zone_ID']);
          const zoneId = rawId ? normId(rawId) : zoneAssigner.next();
          const zoneName = getRowValue(r, ['ZoneName', 'Name', 'Zone', 'Zone_Name']);
          cleanedZones.push({ ZoneID: zoneId, ZoneName: zoneName });
          zoneLookup[normId(zoneId)] = zoneId;
          if (zoneName) {
            const zn = zoneName.toLowerCase().trim();
            zoneLookup[zn] = zoneId;
            zoneLookup[zn.replace(/zone\s*/i, '').trim()] = zoneId;
          }
        });
        counts.push(`• ${cleanedZones.length} Zones`);
      }

      // 2. DISTRICTS
      const distRows = getSheetCleanRows(workbook, ['Districts', 'District']);
      let cleanedDistricts = null;
      if (distRows && distRows.length > 0) {
        cleanedDistricts = [];
        const distAssigner = createBatchIdAssigner(isReplace ? [] : curDB.districts, 'DistrictID', 'D', 2);
        distRows.forEach(r => {
          const rawId = getRowValue(r, ['DistrictID', 'ID', 'District_ID']);
          if (rawId) distAssigner.register(normId(rawId));
        });
        distRows.forEach(r => {
          const rawId = getRowValue(r, ['DistrictID', 'ID', 'District_ID']);
          const distId = rawId ? normId(rawId) : distAssigner.next();
          const distName = getRowValue(r, ['DistrictName', 'Name', 'District', 'District_Name']);
          const rawZone = getRowValue(r, ['ZoneID', 'Zone', 'ZoneName', 'Zone_ID', 'Zone_Name']);
          let zoneId = '';
          if (rawZone) {
            const rz = rawZone.toLowerCase().trim();
            zoneId = zoneLookup[normId(rawZone)] || zoneLookup[rz] || zoneLookup[rz.replace(/zone\s*/i, '').trim()] || normId(rawZone);
            if (!zoneLookup[normId(zoneId)]) {
              warnings.push(`District "${distName || distId}": Zone "${rawZone}" not found.`);
            }
          }
          cleanedDistricts.push({ DistrictID: distId, DistrictName: distName, ZoneID: zoneId });
          districtLookup[normId(distId)] = distId;
          if (distName) districtLookup[distName.toLowerCase().trim()] = distId;
        });
        counts.push(`• ${cleanedDistricts.length} Districts`);
      }

      // 3. PARAMETERS
      const paramRows = getSheetCleanRows(workbook, ['Parameters', 'Parameter']);
      let cleanedParams = null;
      if (paramRows && paramRows.length > 0) {
        cleanedParams = [];
        const paramAssigner = createBatchIdAssigner(isReplace ? [] : curDB.parameters, 'ParameterID', 'P', 2);
        paramRows.forEach(r => {
          const rawId = getRowValue(r, ['ParameterID', 'ID', 'Parameter_ID']);
          if (rawId) paramAssigner.register(normId(rawId));
        });
        paramRows.forEach(r => {
          const rawId = getRowValue(r, ['ParameterID', 'ID', 'Parameter_ID']);
          const paramId = rawId ? normId(rawId) : paramAssigner.next();
          const paramName = getRowValue(r, ['ParameterName', 'Name', 'Parameter', 'Parameter_Name']);
          const unit = getRowValue(r, ['Unit', 'UnitName']);
          const cat = getRowValue(r, ['Category', 'Type']) || 'Chemical';
          cleanedParams.push({ ParameterID: paramId, ParameterName: paramName, Unit: unit, Category: cat });
          paramLookup[normId(paramId)] = paramId;
          if (paramName) {
            const pn = paramName.toLowerCase().trim();
            paramLookup[pn] = paramId;
            paramLookup[pn.replace(/\s*\([^)]*\)/g, '').trim()] = paramId;
          }
        });
        counts.push(`• ${cleanedParams.length} Parameters`);
      }

      // 4. CHEMICALS
      const chemRows = getSheetCleanRows(workbook, ['Chemicals', 'Chemical']);
      let cleanedChems = null;
      if (chemRows && chemRows.length > 0) {
        cleanedChems = [];
        const chemAssigner = createBatchIdAssigner(isReplace ? [] : curDB.chemicals, 'ChemicalID', 'CH', 2);
        chemRows.forEach(r => {
          const rawId = getRowValue(r, ['ChemicalID', 'ID', 'Chemical_ID']);
          if (rawId) chemAssigner.register(normId(rawId));
        });
        chemRows.forEach(r => {
          const rawId = getRowValue(r, ['ChemicalID', 'ID', 'Chemical_ID']);
          const chemId = rawId ? normId(rawId) : chemAssigner.next();
          const chemName = getRowValue(r, ['ChemicalName', 'Name', 'Chemical', 'Chemical_Name']);
          const unit = getRowValue(r, ['Unit', 'UnitName']);
          cleanedChems.push({ ChemicalID: chemId, ChemicalName: chemName, Unit: unit });
          chemLookup[normId(chemId)] = chemId;
          if (chemName) chemLookup[chemName.toLowerCase().trim()] = chemId;
          chemUnitMap[chemId] = unit;
        });
        counts.push(`• ${cleanedChems.length} Chemicals`);
      }

      // 5. FISCAL YEARS
      const fyRows = getSheetCleanRows(workbook, ['FiscalYears', 'FiscalYear', 'FY']);
      let cleanedFYs = null;
      if (fyRows && fyRows.length > 0) {
        cleanedFYs = [];
        const fyAssigner = createBatchIdAssigner(isReplace ? [] : curDB.fiscalYears, 'FYID', 'FY', 2);
        fyRows.forEach(r => {
          const rawId = getRowValue(r, ['FYID', 'ID', 'FY_ID']);
          const fyLabel = getRowValue(r, ['FYLabel', 'FiscalYear', 'Label', 'Year', 'FY_Label']);
          let fyId = '';
          if (rawId) {
            fyId = normId(rawId);
            fyAssigner.register(fyId);
          } else if (fyLabel) {
            const m = fyLabel.match(/(\d{4})[^\d]+(\d{4}|\d{2})/);
            if (m) {
              const y1 = m[1].slice(-2);
              const y2 = m[2].slice(-2);
              fyId = 'FY' + y1 + y2;
            } else {
              fyId = fyAssigner.next();
            }
          } else {
            fyId = fyAssigner.next();
          }
          const activeVal = getRowValue(r, ['IsActive', 'Active', 'Status']);
          const isActive = activeVal === 'true' || activeVal === '1' || r.IsActive === true || r.Active === true || r.Active === 1;
          cleanedFYs.push({ FYID: fyId, FYLabel: fyLabel, IsActive: isActive });
          fyLookup[normId(fyId)] = fyId;
          if (fyLabel) fyLookup[fyLabel.toLowerCase().trim()] = fyId;
        });
        counts.push(`• ${cleanedFYs.length} Fiscal Years`);
      }

      // ================= PASS 2: RELATIONAL ENTITIES =================

      // Combine all districts for EXEN zone auto-resolution
      const allDistrictsMap = {};
      (cleanedDistricts || []).forEach(d => { if (d.DistrictID) allDistrictsMap[normId(d.DistrictID)] = d; });
      if (!isReplace) {
        (curDB.districts || []).forEach(d => {
          const nid = normId(d.DistrictID);
          if (!allDistrictsMap[nid]) allDistrictsMap[nid] = d;
        });
      }

      // 6. USERS
      const userRows = getSheetCleanRows(workbook, ['Users', 'User']);
      let cleanedUsers = null;
      if (userRows && userRows.length > 0) {
        cleanedUsers = [];
        userRows.forEach(r => {
          const email = getRowValue(r, ['Email', 'Mail', 'UserEmail']).toLowerCase();
          if (!email) return;
          const name = getRowValue(r, ['Name', 'UserName', 'FullName']) || email;
          let role = (getRowValue(r, ['Role', 'UserRole']) || 'EXEN').toUpperCase();
          if (!['ADMIN', 'CHEMIST', 'EXEN'].includes(role)) role = 'EXEN';

          const rawDist = getRowValue(r, ['DistrictID', 'District', 'DistrictName', 'District_ID', 'District_Name']);
          let distId = '';
          if (rawDist) {
            distId = districtLookup[normId(rawDist)] || districtLookup[rawDist.toLowerCase().trim()] || normId(rawDist);
            if (!districtLookup[normId(distId)]) {
              warnings.push(`User "${email}": District "${rawDist}" not found.`);
            }
          }

          const rawZone = getRowValue(r, ['ZoneID', 'Zone', 'ZoneName', 'Zone_ID', 'Zone_Name']);
          let zoneId = '';
          if (rawZone) {
            const rz = rawZone.toLowerCase().trim();
            zoneId = zoneLookup[normId(rawZone)] || zoneLookup[rz] || zoneLookup[rz.replace(/zone\s*/i, '').trim()] || normId(rawZone);
            if (!zoneLookup[normId(zoneId)]) {
              warnings.push(`User "${email}": Zone "${rawZone}" not found.`);
            }
          }

          // Auto-fill ZoneID for EXEN if District is assigned
          if (role === 'EXEN' && distId && !zoneId) {
            const matchD = allDistrictsMap[normId(distId)];
            if (matchD && matchD.ZoneID) zoneId = normId(matchD.ZoneID);
          }

          const activeVal = getRowValue(r, ['Active', 'IsActive', 'Status']);
          const active = activeVal === '' ? true : (activeVal === 'true' || activeVal === '1' || r.Active === true || r.Active === 1);

          cleanedUsers.push({
            Email: email,
            Name: name,
            Role: role,
            DistrictID: distId,
            ZoneID: zoneId,
            Active: active
          });
        });
        counts.push(`• ${cleanedUsers.length} Users`);
      }

      // 7. CHEMICAL RECIPES
      const recipeRows = getSheetCleanRows(workbook, ['ChemicalRecipes', 'Recipes', 'Recipe', 'Chemical_Recipe']);
      let cleanedRecipes = null;
      if (recipeRows && recipeRows.length > 0) {
        cleanedRecipes = [];
        const recipeAssigner = createBatchIdAssigner(isReplace ? [] : curDB.parameterChemicals, 'RowID', 'PC', 3);
        recipeRows.forEach(r => {
          const rawRowId = getRowValue(r, ['RowID', 'ID', 'Row_ID']);
          if (rawRowId) recipeAssigner.register(normId(rawRowId));
        });
        recipeRows.forEach(r => {
          const rawRowId = getRowValue(r, ['RowID', 'ID', 'Row_ID']);
          const rowId = rawRowId ? normId(rawRowId) : recipeAssigner.next();

          const rawParam = getRowValue(r, ['ParameterID', 'Parameter', 'ParameterName', 'ParamID', 'Param']);
          let paramId = '';
          if (rawParam) {
            const rp = rawParam.toLowerCase().trim();
            paramId = paramLookup[normId(rawParam)] || paramLookup[rp] || paramLookup[rp.replace(/\s*\([^)]*\)/g, '').trim()] || normId(rawParam);
            if (!paramLookup[normId(paramId)]) {
              warnings.push(`Recipe [${rowId}]: Parameter "${rawParam}" not found.`);
            }
          }

          const rawChem = getRowValue(r, ['ChemicalID', 'Chemical', 'ChemicalName', 'ChemID', 'Chem']);
          let chemId = '';
          if (rawChem) {
            const rc = rawChem.toLowerCase().trim();
            chemId = chemLookup[normId(rawChem)] || chemLookup[rc] || normId(rawChem);
            if (!chemLookup[normId(chemId)]) {
              warnings.push(`Recipe [${rowId}]: Chemical "${rawChem}" not found.`);
            }
          }

          const qty = Number(getRowValue(r, ['QtyPerTest', 'Qty', 'Quantity'])) || 0;
          const unit = chemUnitMap[chemId] || getRowValue(r, ['Unit', 'UnitName']) || '';

          cleanedRecipes.push({
            RowID: rowId,
            ParameterID: paramId,
            ChemicalID: chemId,
            QtyPerTest: qty,
            Unit: unit
          });
        });
        counts.push(`• ${cleanedRecipes.length} Recipes`);
      }

      // 8. PROJECTS
      const projRows = getSheetCleanRows(workbook, ['Projects', 'Project']);
      let cleanedProjects = null;
      if (projRows && projRows.length > 0) {
        cleanedProjects = [];
        const projAssigner = createBatchIdAssigner(isReplace ? [] : curDB.projects, 'ProjectID', 'PRJ', 3);
        projRows.forEach(r => {
          const rawProjId = getRowValue(r, ['ProjectID', 'ID', 'Project_ID']);
          if (rawProjId) projAssigner.register(normId(rawProjId));
        });
        projRows.forEach(r => {
          const rawProjId = getRowValue(r, ['ProjectID', 'ID', 'Project_ID']);
          const projId = rawProjId ? normId(rawProjId) : projAssigner.next();
          const projName = getRowValue(r, ['ProjectName', 'Name', 'Project', 'Project_Name']);

          const rawScope = getRowValue(r, ['DistrictScope', 'DistrictIDs', 'DistrictID', 'Districts', 'District']);
          const isAll = !rawScope || rawScope.toUpperCase() === 'ALL';
          let distList = [];
          if (isAll) {
            distList = ['ALL'];
          } else {
            distList = rawScope.split(',').map(s => s.trim()).filter(Boolean).map(item => {
              const res = districtLookup[normId(item)] || districtLookup[item.toLowerCase().trim()] || normId(item);
              if (!districtLookup[normId(res)]) {
                warnings.push(`Project "${projName || projId}": District "${item}" not found.`);
              }
              return res;
            });
          }

          const rawFy = getRowValue(r, ['FYID', 'FiscalYear', 'FYLabel', 'Year', 'FY_ID']);
          let fyId = '';
          if (rawFy) {
            fyId = fyLookup[normId(rawFy)] || fyLookup[rawFy.toLowerCase().trim()] || normId(rawFy);
            if (!fyLookup[normId(fyId)]) {
              warnings.push(`Project "${projName || projId}": Fiscal Year "${rawFy}" not found.`);
            }
          }

          cleanedProjects.push({
            ProjectID: projId,
            ProjectName: projName,
            DistrictIDs: distList,
            DistrictID: isAll ? 'ALL' : distList.join(','),
            IsAllDistricts: isAll,
            FYID: fyId,
            CreatedAt: getRowValue(r, ['CreatedAt', 'Date']) || nowStr()
          });
        });
        counts.push(`• ${cleanedProjects.length} Projects`);
      }

      // Validation
      if (counts.length === 0) {
        alert('No recognized setup sheets (such as Zones, Districts, Users, Parameters, Chemicals, Recipes, Projects, FiscalYears) were found in the Excel file.\n\nPlease check that sheet names match the downloaded template.');
        return;
      }

      // Confirmation Modal
      let confirmMsg = `📊 Excel Setup Data Preview (${mode.toUpperCase()} MODE):

` +
        counts.join('\n');
      if (warnings.length > 0) {
        const topWarn = warnings.slice(0, 6);
        confirmMsg += `

⚠️ Warnings (${warnings.length}):
• ` + topWarn.join('\n• ');
        if (warnings.length > 6) {
          confirmMsg += `
... and ${warnings.length - 6} more warnings.`;
        }
      }
      confirmMsg += `

Do you want to save this setup data to the server?`;

      if (!confirm(confirmMsg)) {
        return;
      }

      if (btn) {
        btn.innerHTML = '⚡ Uploading to server... Please wait.';
      }

      const payload = {};
      if (cleanedZones) payload.zones = cleanedZones;
      if (cleanedDistricts) payload.districts = cleanedDistricts;
      if (cleanedUsers) payload.users = cleanedUsers;
      if (cleanedParams) payload.parameters = cleanedParams;
      if (cleanedChems) payload.chemicals = cleanedChems;
      if (cleanedRecipes) payload.parameterChemicals = cleanedRecipes;
      if (cleanedFYs) payload.fiscalYears = cleanedFYs;
      if (cleanedProjects) payload.projects = cleanedProjects;

      await gsr('adminImportSetupData', mode, payload);
      window.DB = null;
      await renderAdminView(true);
      alert('✓ Excel setup successfully saved to server!\n\nRecord Summary:\n' + counts.join('\n'));

    } catch (err) {
      alert('Error processing Excel setup: ' + (err && err.message ? err.message : String(err)));
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = originalBtnText || '⚡ Process & Load Setup from Excel';
      }
    }
  };
  reader.readAsArrayBuffer(file);
}

function bindBackupTab(data) {
  const btn = document.getElementById('executeExcelImportBtn');
  if (btn) btn.addEventListener('click', processExcelSetupUpload);
}



/* ============ PRODUCTION BOOT ============ */
window.addEventListener('DOMContentLoaded', () => {
  if (!CURRENT_USER) {
    handleLogout();
    return;
  }
  document.getElementById('userNameDisplay').textContent = CURRENT_USER.name || CURRENT_USER.email;
  document.getElementById('roleBadgeDisplay').textContent = CURRENT_USER.role;
  ['exenView', 'chemistView', 'adminView'].forEach(id => document.getElementById(id).style.display = 'none');
  if (CURRENT_USER.role === 'EXEN') {
    document.getElementById('exenView').style.display = 'block';
    renderExenView();
  } else if (CURRENT_USER.role === 'CHEMIST') {
    document.getElementById('chemistView').style.display = 'block';
    renderChemistView();
  } else if (CURRENT_USER.role === 'ADMIN') {
    document.getElementById('adminView').style.display = 'block';
    renderAdminView(true);
  }
});

// Auto-refresh when tab gains focus so user instantly sees entries sent back by admin
window.addEventListener('focus', () => {
  if (CURRENT_USER && CURRENT_USER.role === 'EXEN' && typeof EXEN_STATE !== 'undefined' && EXEN_STATE.districtId) {
    refreshExenDashboard();
  } else if (CURRENT_USER && CURRENT_USER.role === 'CHEMIST' && typeof CHEMIST_STATE !== 'undefined' && CHEMIST_STATE.zoneId) {
    refreshChemistDashboard();
  }
});

// Quiet background periodic sync (every 20s if tab is visible)
setInterval(() => {
  if (document.hidden) return;
  if (CURRENT_USER && CURRENT_USER.role === 'EXEN' && typeof EXEN_STATE !== 'undefined' && EXEN_STATE.districtId) {
    refreshExenDashboard();
  } else if (CURRENT_USER && CURRENT_USER.role === 'CHEMIST' && typeof CHEMIST_STATE !== 'undefined' && CHEMIST_STATE.zoneId) {
    refreshChemistDashboard();
  }
}, 20000);
</script>
