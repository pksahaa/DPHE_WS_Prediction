<script>
// Authentication & Session Context — read from sessionStorage,
// which Login (index.html) populated after a successful login.
// If nothing is there, bounce back to the login page immediately.
var SESSION_TOKEN = sessionStorage.getItem('dphe_auth_token');
var CURRENT_USER = null;
try {
  CURRENT_USER = JSON.parse(sessionStorage.getItem('dphe_user'));
} catch (e) {
  CURRENT_USER = null;
}
if (!SESSION_TOKEN || !CURRENT_USER) {
  window.location.href = 'index.html';
}

// Global DB cache for UI tab navigation
var DB = {
  zones: [], districts: [], users: [], parameters: [], chemicals: [],
  parameterChemicals: [], fiscalYears: [], projects: [], sampleEntries: [],
  privateSampleEntries: []
};

// Low-level RPC helper — calls the Apps Script Web App with a
// { fn, args } JSON body over POST. "text/plain" content type is
// used deliberately so the browser skips the CORS preflight
// (Apps Script Web Apps can't respond to custom OPTIONS requests).
function apiCall(fnName, args) {
  if (!API_URL || API_URL.indexOf('[') === 0) {
    return Promise.reject(new Error('API_URL কনফিগার করা হয়নি। app.html ফাইলের উপরে সেট করুন।'));
  }
  var controller = new AbortController();
  var timeoutId = setTimeout(function() { controller.abort(); }, 25000); // 25s safety timeout

  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fnName, args: args || [] }),
    signal: controller.signal
  })
    .then(function(res) {
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error('Network error: ' + res.status + ' ' + res.statusText);
      return res.json();
    })
    .then(function(json) {
      if (!json.success) throw new Error(json.error || 'Unknown API error.');
      return json.data;
    })
    .catch(function(err) {
      clearTimeout(timeoutId);
      if (err && err.name === 'AbortError') {
        throw new Error('সার্ভার থেকে সময়মতো উত্তর আসেনি (২৫ সেকেন্ড)। আবার চেষ্টা করুন।');
      }
      throw err;
    });
}

// Drop-in replacement for the old google.script.run-based gsr():
// same call signature (gsr('fnName', arg1, arg2, ...)) so none of
// the 40+ call sites elsewhere in this file need to change.
function gsr(fnName, ...args) {
  return apiCall(fnName, [SESSION_TOKEN, ...args]).catch(function(err) {
    var msg = err && err.message ? err.message : String(err);
    if (msg.includes('মেয়াদ শেষ') || msg.includes('Session expired') || msg.includes('লগইন করুন')) {
      alert('আপনার সেশনের মেয়াদ শেষ হয়েছে। পুনরায় লগইন করুন।');
      handleLogout();
    }
    throw err;
  });
}

function handleLogout() {
  var token = SESSION_TOKEN;
  sessionStorage.removeItem('dphe_auth_token');
  sessionStorage.removeItem('dphe_user');
  // Tell the backend in the background, but don't make the user
  // wait on the network for this — go straight to the login page.
  try {
    apiCall('doLogout', [token]).catch(function() { /* ignore */ });
  } catch (e) { /* ignore */ }
  window.location.href = 'index.html';
}

function openChangePasswordModal() {
  document.getElementById('pwdModalAlert').innerHTML = '';
  document.getElementById('oldPasswordInput').value = '';
  document.getElementById('newPasswordInput').value = '';
  document.getElementById('confirmPasswordInput').value = '';
  document.getElementById('changePasswordModal').classList.add('show');
}

function closeChangePasswordModal() {
  document.getElementById('changePasswordModal').classList.remove('show');
}

function handleChangePasswordSubmit(e) {
  e.preventDefault();
  var oldPass = document.getElementById('oldPasswordInput').value;
  var newPass = document.getElementById('newPasswordInput').value;
  var confirmPass = document.getElementById('confirmPasswordInput').value;
  var alertBox = document.getElementById('pwdModalAlert');
  var btn = document.getElementById('savePwdBtn');

  if (newPass !== confirmPass) {
    alertBox.innerHTML = '<div class="msg error">নতুন পাসওয়ার্ড দুটি মিলছে না।</div>';
    return;
  }

  btn.disabled = true;
  alertBox.innerHTML = '<div class="msg info">সংরক্ষণ করা হচ্ছে...</div>';

  gsr('changeUserPassword', oldPass, newPass)
    .then(function(res) {
      btn.disabled = false;
      alertBox.innerHTML = '<div class="msg success">' + esc(res.message || 'পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে!') + '</div>';
      setTimeout(closeChangePasswordModal, 1500);
    })
    .catch(function(err) {
      btn.disabled = false;
      alertBox.innerHTML = '<div class="msg error">' + esc(err.message || 'ত্রুটি হয়েছে') + '</div>';
    });
}

function promptResetUserPassword(email) {
  var newPass = prompt('Enter new password for ' + email + ' (Leave blank for default: dphe2025):', 'dphe2025');
  if (newPass === null) return;
  newPass = newPass.trim() || 'dphe2025';
  gsr('adminResetUserPassword', email, newPass)
    .then(function(res) {
      alert('✓ ' + (res.message || 'Password reset successfully!'));
    })
    .catch(function(err) {
      alert('Error: ' + err.message);
    });
}

/* ============ SHARED HELPERS ============ */
function esc(s) {
  return (s === undefined || s === null) ? '' : String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function showMsg(containerEl, text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  containerEl.prepend(div);
  setTimeout(() => div.remove(), 4000);
}
function paramCheckboxList(parameters, name) {
  return `<div class="param-list">` + parameters.map(p =>
    `<label><input type="checkbox" value="${esc(p.ParameterID)}" data-group="${name}"> ${esc(p.ParameterName)} <span style="color:#9ca3af">(${esc(p.Unit)})</span></label>`
  ).join('') + `</div>`;
}
function getCheckedParamIds(formEl, name) {
  return Array.from(formEl.querySelectorAll(`input[data-group="${name}"]:checked`)).map(el => el.value);
}
function paramNamesFromIds(ids, parameters) {
  const map = {}; parameters.forEach(p => map[p.ParameterID] = p.ParameterName);
  return ids.map(id => map[id] || id).join(', ');
}
function fyOptions(fiscalYears, selectedId) {
  return fiscalYears.map(fy =>
    `<option value="${esc(fy.FYID)}" ${fy.FYID === selectedId ? 'selected' : ''}>${esc(fy.FYLabel)}${fy.IsActive ? ' (Active)' : ''}</option>`
  ).join('');
}
function confirmDelete(name) {
  return confirm(`"${name}" মুছে ফেলতে চান? এই কাজ undo করা যাবে না।`);
}

/* =====================================================================
   EXEN VIEW
   ===================================================================== */
let EXEN_STATE = { fyId: null, districtId: null, districtName: '', parameters: [], projects: [] };

async function renderExenView() {
  const el = document.getElementById('exenView');
  el.innerHTML = `<div class="loading">Loading...</div>`;

  const [fiscalYears, districts, parameters] = await Promise.all([
    gsr('getFiscalYears'), gsr('getDistricts'), gsr('getParameters')
  ]);

  const myDistrict = districts.find(d => d.DistrictID === CURRENT_USER.districtId);
  EXEN_STATE.districtId = CURRENT_USER.districtId;
  EXEN_STATE.districtName = myDistrict ? myDistrict.DistrictName : CURRENT_USER.districtId;
  EXEN_STATE.parameters = parameters;

  const activeFY = fiscalYears.find(f => f.IsActive) || fiscalYears[0];
  EXEN_STATE.fyId = activeFY ? activeFY.FYID : null;

  el.innerHTML = `
    <div class="card">
      <h2>District: ${esc(EXEN_STATE.districtName)}</h2>
      <div class="row">
        <div class="col"><label>Fiscal Year</label><select id="exenFY">${fyOptions(fiscalYears, EXEN_STATE.fyId)}</select></div>
      </div>
    </div>
    <div class="card" id="exenSummaryCard"><div class="loading">Loading summary...</div></div>
    <div class="card">
      <h2>Add Sample Requirement (Project-wise)</h2>
      <p style="font-size:13px;color:#6b7280;margin-bottom:10px">📋 Projects are created by the Admin. Select the project assigned to your district below.</p>
      <div class="row">
        <div class="col"><label>Select Project</label><select id="exenProjectSelect"><option value="">-- Select project --</option></select></div>
      </div>
      <h3>Parameters to test per sample</h3>
      ${paramCheckboxList(parameters, 'exen')}
      <div class="row">
        <div class="col"><label>Expected Number of Samples (this fiscal year)</label><input type="number" id="exenExpectedSamples" min="0" placeholder="e.g. 250"></div>
      </div>
      <label>Remarks (optional)</label><textarea id="exenRemarks"></textarea>
      <button type="button" id="exenSubmitBtn">Save Requirement</button>
    </div>
    <div class="card"><h2>Submitted Entries</h2><div id="exenEntriesTable"><div class="loading">Loading...</div></div></div>
  `;

  document.getElementById('exenFY').addEventListener('change', e => { EXEN_STATE.fyId = e.target.value; loadExenProjects(); refreshExenDashboard(); });
  document.getElementById('exenSubmitBtn').addEventListener('click', exenSubmitEntry);

  await loadExenProjects();
  await refreshExenDashboard();
}

async function loadExenProjects() {
  const projects = await gsr('getProjects', EXEN_STATE.districtId, EXEN_STATE.fyId);
  EXEN_STATE.projects = projects;
  const sel = document.getElementById('exenProjectSelect');
  if (!sel) return;
  sel.innerHTML = `<option value="">-- Select project --</option>` + projects.map(p => `<option value="${esc(p.ProjectID)}">${esc(p.ProjectName)}</option>`).join('');
}

async function exenSubmitEntry() {
  const projectId = document.getElementById('exenProjectSelect').value;
  const expectedSamples = document.getElementById('exenExpectedSamples').value;
  const remarks = document.getElementById('exenRemarks').value;
  const paramIds = getCheckedParamIds(document, 'exen');

  if (!projectId) { alert('Admin কর্তৃক assign করা কোনো project select করুন।'); return; }
  if (!expectedSamples || Number(expectedSamples) <= 0) { alert('Enter expected number of samples.'); return; }
  if (paramIds.length === 0) { alert('Select at least one parameter.'); return; }

  const btn = document.getElementById('exenSubmitBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await gsr('saveSampleEntry', { fyId: EXEN_STATE.fyId, districtId: EXEN_STATE.districtId, projectId, expectedSamples, parameterIds: paramIds, remarks });
    document.getElementById('exenExpectedSamples').value = '';
    document.getElementById('exenRemarks').value = '';
    document.querySelectorAll('input[data-group="exen"]').forEach(cb => cb.checked = false);
    await refreshExenDashboard();
    showMsg(document.getElementById('exenView'), 'Saved successfully.', 'success');
  } catch (err) {
    showMsg(document.getElementById('exenView'), 'Error: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Requirement';
  }
}

let EXEN_CURRENT_ENTRIES = [];

async function refreshExenDashboard() {
  const data = await gsr('getDistrictDashboard', EXEN_STATE.districtId, EXEN_STATE.fyId);
  EXEN_CURRENT_ENTRIES = data.entries || [];
  const card = document.getElementById('exenSummaryCard');
  if (!card) return;

  const sentBackCount = data.entries.filter(e => e.status === 'SENT_BACK').length;
  card.innerHTML = `
    <h2>Fiscal Year Summary</h2>
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${data.totalSamples}</div><div class="lbl">Active Expected Samples (In Calculation)</div></div>
      <div class="stat-box"><div class="num">${data.entries.filter(e => e.status !== 'SENT_BACK').length}</div><div class="lbl">Active Submissions</div></div>
      ${sentBackCount > 0 ? `<div class="stat-box" style="background:#fff1f2;border:1px solid #fecdd3"><div class="num" style="color:#e11d48">${sentBackCount}</div><div class="lbl" style="color:#be123c;font-weight:600">⚠️ Needs Revision (Sent Back by Admin)</div></div>` : ''}
    </div>
  `;
  const tableEl = document.getElementById('exenEntriesTable');
  if (!tableEl) return;
  tableEl.innerHTML = data.entries.length === 0 ? `<div class="empty-state">No entries yet.</div>` : `
    <table>
      <thead>
        <tr>
          <th>Project</th>
          <th>Expected Samples</th>
          <th>Parameters</th>
          <th>Status</th>
          <th>Remarks</th>
          <th>Date</th>
          <th style="text-align:right">Actions</th>
        </tr>
      </thead>
      <tbody>
        ${data.entries.map(e => {
          const isSentBack = e.status === 'SENT_BACK';
          return `
          <tr id="exen-entry-${esc(e.entryId)}" style="${isSentBack ? 'background:#fff1f2' : ''}">
            <td><strong>${esc(e.projectName)}</strong></td>
            <td style="font-weight:700;font-size:14px;color:${isSentBack ? '#e11d48' : '#0d6efd'}">${esc(e.expectedSamples)}</td>
            <td style="font-size:12px">${esc(paramNamesFromIds(e.parameterIds, EXEN_STATE.parameters))}</td>
            <td>
              ${isSentBack ? `
                <span class="badge" style="background:#fee2e2;color:#991b1b;font-weight:700;padding:3px 8px">⚠️ Sent Back for Revision</span>
                <div style="font-size:11px;color:#dc2626;margin-top:3px"><strong>Admin Note:</strong> ${esc(e.sendBackReason || 'Revision needed')}</div>
                <div style="font-size:10px;color:#64748b;font-style:italic">Excluded from chemical calculation</div>
              ` : `
                <span class="badge" style="background:#dcfce7;color:#166534;font-weight:600;padding:3px 8px">🔒 Submitted (Locked)</span>
              `}
            </td>
            <td style="font-size:12px;color:#64748b">${esc(e.remarks || '-')}</td>
            <td style="font-size:12px;color:#64748b">${esc(e.enteredAt)}</td>
            <td style="text-align:right">
              ${isSentBack ? `
                <div class="td-actions" style="justify-content:flex-end">
                  <button type="button" class="btn-sm btn-edit" style="background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;font-weight:600" onclick="editExenEntry('${esc(e.entryId)}')">✏️ Edit & Resubmit</button>
                  <button type="button" class="btn-sm btn-delete" onclick="deleteExenEntry('${esc(e.entryId)}')">🗑️ Discard</button>
                </div>
              ` : `
                <span style="font-size:11px;color:#94a3b8;font-style:italic">🔒 Locked (Admin send-back needed)</span>
              `}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function editExenEntry(entryId) {
  const row = document.getElementById('exen-entry-' + entryId);
  const entry = EXEN_CURRENT_ENTRIES.find(e => e.entryId === entryId);
  if (!row || !entry) return;

  const currentParamIds = entry.parameterIds || [];
  const projOptions = EXEN_STATE.projects.map(p => 
    `<option value="${esc(p.ProjectID)}" ${p.ProjectID === entry.projectId ? 'selected' : ''}>${esc(p.ProjectName)}</option>`
  ).join('');

  row.classList.add('editing');
  row.innerHTML = `
    <td colspan="7" style="background:#fffbeb;padding:16px;border:2px solid #f59e0b;border-radius:8px">
      <div style="font-weight:700;color:#92400e;margin-bottom:8px;font-size:14px">✏️ Edit & Resubmit Requirement (Admin Note: ${esc(entry.sendBackReason || 'Revision needed')})</div>
      <div class="row">
        <div class="col"><label>Project</label><select id="eee-proj-${esc(entryId)}">${projOptions}</select></div>
        <div class="col"><label>Expected Samples</label><input type="number" id="eee-samples-${esc(entryId)}" value="${esc(entry.expectedSamples)}" min="1"></div>
      </div>
      <label style="margin-top:6px;font-weight:600">Parameters to test:</label>
      <div class="param-list" style="max-height:140px;overflow-y:auto;background:#fff;margin-bottom:10px">
        ${EXEN_STATE.parameters.map(p => `
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;margin-right:12px">
            <input type="checkbox" value="${esc(p.ParameterID)}" class="eee-param-cb-${esc(entryId)}" ${currentParamIds.includes(p.ParameterID) ? 'checked' : ''} style="margin:0;width:auto">
            ${esc(p.ParameterName)}
          </label>
        `).join('')}
      </div>
      <div class="row">
        <div class="col"><label>Remarks</label><input type="text" id="eee-remarks-${esc(entryId)}" value="${esc(entry.remarks || '')}"></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
        <button type="button" class="btn-sm btn-save" onclick="saveExenEntry('${esc(entryId)}')">🚀 Save & Resubmit</button>
        <button type="button" class="btn-sm btn-cancel" onclick="refreshExenDashboard()">Cancel</button>
      </div>
    </td>`;
}

async function saveExenEntry(entryId) {
  const projectId = document.getElementById('eee-proj-' + entryId).value;
  const expectedSamples = document.getElementById('eee-samples-' + entryId).value;
  const remarks = document.getElementById('eee-remarks-' + entryId).value;
  const paramIds = Array.from(document.querySelectorAll(`.eee-param-cb-${entryId}:checked`)).map(cb => cb.value);

  if (!projectId) { alert('Project select করুন।'); return; }
  if (!expectedSamples || Number(expectedSamples) <= 0) { alert('Valid expected samples দিন।'); return; }
  if (paramIds.length === 0) { alert('কমপক্ষে একটি parameter select করুন।'); return; }

  try {
    await gsr('updateSampleEntry', entryId, { projectId, expectedSamples, parameterIds: paramIds, remarks });
    await refreshExenDashboard();
    showMsg(document.getElementById('exenView'), 'Entry re-submitted successfully. It is now locked and re-included in chemical calculations.', 'success');
  } catch(err) {
    alert(err.message);
  }
}

async function deleteExenEntry(entryId) {
  if (!confirm('আপনি কি নিশ্চিত যে এই ফেরত আসা (Sent Back) এন্ট্রিটি বাতিল / মুছে ফেলতে চান?')) return;
  try {
    await gsr('deleteSampleEntry', entryId);
    await refreshExenDashboard();
    showMsg(document.getElementById('exenView'), 'Entry discarded successfully.', 'success');
  } catch(err) {
    alert(err.message);
  }
}

   CHEMIST VIEW

let CHEMIST_STATE = { fyId: null, zoneId: null, zoneName: '', parameters: [] };
let CHEMIST_CURRENT_ENTRIES = [];

async function renderChemistView() {
  const el = document.getElementById('chemistView');
  el.innerHTML = `<div class="loading">Loading...</div>`;

  const [fiscalYears, zones, parameters] = await Promise.all([gsr('getFiscalYears'), gsr('getZones'), gsr('getParameters')]);
  const myZone = zones.find(z => z.ZoneID === CURRENT_USER.zoneId) || zones[0];
  CHEMIST_STATE.zoneId = (myZone ? myZone.ZoneID : CURRENT_USER.zoneId) || (zones[0] ? zones[0].ZoneID : 'Z1');
  CHEMIST_STATE.zoneName = myZone ? myZone.ZoneName : 'Zonal Laboratory';
  CHEMIST_STATE.parameters = parameters;
  const activeFY = fiscalYears.find(f => f.IsActive) || fiscalYears[0];
  CHEMIST_STATE.fyId = activeFY ? activeFY.FYID : null;

  el.innerHTML = `
    <div class="card">
      <h2>Zone: ${esc(CHEMIST_STATE.zoneName)}</h2>
      <div class="row"><div class="col"><label>Fiscal Year</label><select id="chemFY">${fyOptions(fiscalYears, CHEMIST_STATE.fyId)}</select></div></div>
    </div>
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="summary">Zone Summary</button>
      <button type="button" class="tab-btn" data-tab="private">Private Sample Entry</button>
    </div>
    <div class="tab-panel active" id="tab-summary"><div class="card" id="chemSummaryCard"><div class="loading">Loading...</div></div></div>
    <div class="tab-panel" id="tab-private">
      <div class="card">

async function savePrivateEntry(entryId) {
  const clientType = document.getElementById('epe-type-' + entryId).value;
  const clientName = document.getElementById('epe-name-' + entryId).value.trim();
  const expectedSamples = document.getElementById('epe-samples-' + entryId).value;
  const remarks = document.getElementById('epe-remarks-' + entryId).value;
  const paramIds = Array.from(document.querySelectorAll(`.epe-param-cb-${entryId}:checked`)).map(cb => cb.value);

  if (!clientName) { alert('Client / institution name লিখুন।'); return; }
  if (!expectedSamples || Number(expectedSamples) <= 0) { alert('Valid expected samples দিন।'); return; }
  if (paramIds.length === 0) { alert('কমপক্ষে একটি parameter select করুন।'); return; }

  try {
    await gsr('updatePrivateSampleEntry', entryId, { clientType, clientName, expectedSamples, parameterIds: paramIds, remarks });
    await refreshChemistDashboard();
    showMsg(document.getElementById('chemistView'), 'Private sample re-submitted successfully. It is now locked and re-included in chemical calculations.', 'success');
  } catch(err) {
    alert(err.message);
  }
}

async function deletePrivateEntry(entryId) {
  if (!confirm('আপনি কি নিশ্চিত যে এই ফেরত আসা (Sent Back) প্রাইভেট এন্ট্রিটি বাতিল / মুছে ফেলতে চান?')) return;
  try {
    await gsr('deletePrivateSampleEntry', entryId);
    await refreshChemistDashboard();
    showMsg(document.getElementById('chemistView'), 'Entry discarded successfully.', 'success');
  } catch(err) {
    alert(err.message);
  }
}

async function privSubmitEntry() {
  const clientType = document.getElementById('privClientType').value;
  const clientName = document.getElementById('privClientName').value.trim();
  const expectedSamples = document.getElementById('privExpectedSamples').value;
  const remarks = document.getElementById('privRemarks').value;
  const paramIds = getCheckedParamIds(document, 'priv');

  if (!clientName) { alert('Enter client / institution name.'); return; }
  if (!expectedSamples || Number(expectedSamples) <= 0) { alert('Enter expected number of samples.'); return; }
  if (paramIds.length === 0) { alert('Select at least one parameter.'); return; }

  const btn = document.getElementById('privSubmitBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await gsr('savePrivateSampleEntry', { fyId: CHEMIST_STATE.fyId, zoneId: CHEMIST_STATE.zoneId, clientType, clientName, expectedSamples, parameterIds: paramIds, remarks });
    document.getElementById('privClientName').value = '';
    document.getElementById('privExpectedSamples').value = '';
    document.getElementById('privRemarks').value = '';
    document.querySelectorAll('input[data-group="priv"]').forEach(cb => cb.checked = false);
    await refreshChemistDashboard();
    showMsg(document.getElementById('chemistView'), 'Saved successfully.', 'success');
  } catch (err) {
    showMsg(document.getElementById('chemistView'), 'Error: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Private Sample';
  }
}

/* ======= PROJECTS TAB (Admin) ======= */
function formatProjectDistricts(p, distMap) {
  if (p.IsAllDistricts || p.DistrictID === 'ALL' || (Array.isArray(p.DistrictIDs) && p.DistrictIDs.includes('ALL'))) {
    return `<span class="badge" style="background:#dcfce7;color:#166534;font-weight:600;font-size:12px;padding:3px 8px">🌐 All Districts (সকল জেলা)</span>`;
  }
  let ids = [];
  if (Array.isArray(p.DistrictIDs)) ids = p.DistrictIDs;
  else if (p.DistrictID) ids = p.DistrictID.split(',').map(s => s.trim()).filter(Boolean);

  if (ids.length === 0) {
    return `<span style="color:#ef4444;font-style:italic">None</span>`;
  }
  const names = ids.map(id => distMap[id] || id);
  if (ids.length <= 3) {
    return `<span class="badge govt" style="margin-right:4px">${ids.length} Districts:</span> <span style="font-size:12px;color:#334155">${esc(names.join(', '))}</span>`;
  }
  const preview = names.slice(0, 3).join(', ');
  return `<span class="badge govt" style="margin-right:4px" title="${esc(names.join(', '))}">📍 ${ids.length} Districts:</span> <span style="font-size:12px;color:#334155">${esc(preview)}</span> <span style="font-size:11px;color:#64748b;font-weight:500">+${ids.length - 3} more</span>`;
}

function renderDistrictSelector(prefix, selectedDistIds = [], isAll = true) {
  const zoneMap = {}; DB.zones.forEach(z => zoneMap[z.ZoneID] = z.ZoneName);
  const distCheckboxes = DB.districts.map(d => {
    const checked = !isAll && selectedDistIds.includes(d.DistrictID);
    const zName = zoneMap[d.ZoneID] || d.ZoneID;
    return `
      <label class="proj-dist-item" data-name="${esc(d.DistrictName).toLowerCase()}" data-zone="${esc(zName).toLowerCase()}" 
        style="display:flex;align-items:center;gap:6px;background:#fff;padding:5px 8px;border-radius:4px;border:1px solid #e2e8f0;font-size:12px;cursor:pointer">
        <input type="checkbox" class="${prefix}-dist-cb" value="${esc(d.DistrictID)}" ${checked ? 'checked' : ''} onchange="updateProjectDistCount('${prefix}')" style="margin:0;width:auto">
        <span style="flex:1">${esc(d.DistrictName)}</span>
        <span style="font-size:10px;color:#64748b;background:#f1f5f9;padding:1px 5px;border-radius:3px">${esc(zName)}</span>
      </label>`;
  }).join('');

  return `
    <div style="margin:10px 0 14px 0;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px">
      <label style="font-weight:700;color:var(--text);margin-bottom:8px;display:block">
        District Coverage (প্রকল্পের আওতাভুক্ত জেলা):
      </label>
      <div style="display:flex;gap:20px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
        <label style="cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;margin-bottom:0">
          <input type="radio" name="${prefix}-scope" value="ALL" ${isAll ? 'checked' : ''} onchange="toggleProjectScope('${prefix}')" style="margin:0;width:auto">
          🌐 All Districts (সকল জেলার জন্য প্রযোজ্য)
        </label>
        <label style="cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;margin-bottom:0">
          <input type="radio" name="${prefix}-scope" value="SELECTED" ${!isAll ? 'checked' : ''} onchange="toggleProjectScope('${prefix}')" style="margin:0;width:auto">
          📍 Specific Districts (নির্দিষ্ট কিছু জেলা)
        </label>
      </div>

      <div id="${prefix}-all-notice" style="display:${isAll ? 'block' : 'none'};background:#e0f2fe;border:1px solid #bae6fd;color:#0369a1;padding:10px 14px;border-radius:6px;font-size:13px">
        <strong>✓ অল-ডিস্ট্রিক্ট প্রজেক্ট:</strong> এই প্রজেক্টটি সকল জেলার (${DB.districts.length}টি জেলা) EXEN-দের ড্রপডাউনে পাওয়া যাবে। আলাদাভাবে জেলা সিলেক্ট করার প্রয়োজন নেই।
      </div>

      <div id="${prefix}-dist-picker" style="display:${isAll ? 'none' : 'block'};margin-top:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
          <input type="text" id="${prefix}-dist-search" placeholder="🔍 Search district or zone..." 
            onkeyup="filterProjectDistricts('${prefix}')" 
            style="width:220px;margin-bottom:0;padding:5px 9px;font-size:12px;border:1px solid #cbd5e1;border-radius:4px">
          <div style="display:flex;gap:8px;align-items:center">
            <button type="button" class="btn-sm secondary" onclick="bulkCheckDistricts('${prefix}', true)">✓ Select All (${DB.districts.length})</button>
            <button type="button" class="btn-sm secondary" onclick="bulkCheckDistricts('${prefix}', false)">✕ Deselect All</button>
          </div>
        </div>
        <div id="${prefix}-dist-grid" style="max-height:190px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));gap:6px;background:#f1f5f9;padding:8px;border:1px solid #cbd5e1;border-radius:6px">
          ${distCheckboxes}
        </div>
        <div style="font-size:12px;font-weight:600;color:#0369a1;margin-top:6px" id="${prefix}-selected-count">
          ${!isAll ? selectedDistIds.length + ' districts selected' : ''}
        </div>
      </div>
    </div>`;
}

function toggleProjectScope(prefix) {
  const scopeEl = document.querySelector(`input[name="${prefix}-scope"]:checked`);
  const scope = scopeEl ? scopeEl.value : 'ALL';
  const allNotice = document.getElementById(`${prefix}-all-notice`);
  const distPicker = document.getElementById(`${prefix}-dist-picker`);
  if (scope === 'ALL') {
    if (allNotice) allNotice.style.display = 'block';
    if (distPicker) distPicker.style.display = 'none';
  } else {
    if (allNotice) allNotice.style.display = 'none';
    if (distPicker) distPicker.style.display = 'block';
    updateProjectDistCount(prefix);
  }
}

function bulkCheckDistricts(prefix, check) {
  const cbs = document.querySelectorAll(`.${prefix}-dist-cb`);
  cbs.forEach(cb => {
    const parent = cb.closest('.proj-dist-item');
    if (!parent || parent.style.display !== 'none') {
      cb.checked = check;
    }
  });
  updateProjectDistCount(prefix);
}

function filterProjectDistricts(prefix) {
  const searchEl = document.getElementById(`${prefix}-dist-search`);
  const q = (searchEl ? searchEl.value : '').toLowerCase().trim();
  const items = document.querySelectorAll(`#${prefix}-dist-grid .proj-dist-item`);
  items.forEach(item => {
    const name = item.dataset.name || '';
    const zone = item.dataset.zone || '';
    item.style.display = (!q || name.includes(q) || zone.includes(q)) ? 'flex' : 'none';
  });
}

function updateProjectDistCount(prefix) {
  const countEl = document.getElementById(`${prefix}-selected-count`);
  if (!countEl) return;
  const checked = document.querySelectorAll(`.${prefix}-dist-cb:checked`).length;
  countEl.textContent = `✓ ${checked} district(s) selected`;
}

function getProjectScopeData(prefix) {
  const scopeEl = document.querySelector(`input[name="${prefix}-scope"]:checked`);
  const scope = scopeEl ? scopeEl.value : 'ALL';
  if (scope === 'ALL') return ['ALL'];
  return Array.from(document.querySelectorAll(`.${prefix}-dist-cb:checked`)).map(cb => cb.value);
}

        <p style="font-size:13px;color:#6b7280;margin-bottom:14px">
          Admin এখান থেকে প্রজেক্ট তৈরি ও ম্যানেজ করবেন। কোনো প্রজেক্ট সারা দেশের <strong>সকল জেলার</strong> জন্য হতে পারে, আবার <strong>নির্দিষ্ট কিছু জেলার</strong> জন্যও হতে পারে।
        </p>

          <div class="row">
            <div class="col" style="flex:2"><label>Project Name</label><input type="text" id="newProjName" placeholder="e.g. National Safe Water Supply Project"></div>
            <div class="col"><label>Fiscal Year</label><select id="newProjFY">${fyOptions(data.fiscalYears, activeFY.FYID)}</select></div>
          </div>
          ${renderDistrictSelector('new', [], true)}
          <div style="display:flex;justify-content:flex-end">
            <button type="button" id="addProjBtn" style="padding:10px 22px">+ Add Project</button>

function renderSubmissionsTab(data) {
  const distMap = {}; data.districts.forEach(d => distMap[d.DistrictID] = d.DistrictName);
  const zoneMap = {}; data.zones.forEach(z => zoneMap[z.ZoneID] = z.ZoneName);
  const distZoneMap = {}; data.districts.forEach(d => distZoneMap[d.DistrictID] = zoneMap[d.ZoneID] || d.ZoneID);
  const fyMap = {}; data.fiscalYears.forEach(f => fyMap[f.FYID] = f.FYLabel);
  const projMap = {}; (data.projects || []).forEach(p => projMap[p.ProjectID] = p.ProjectName);
  const paramMap = {}; data.parameters.forEach(p => paramMap[p.ParameterID] = p.ParameterName);

  // Government / District submissions (from EXEN)
  const govtEntries = (data.sampleEntries || []).map(e => ({
    entryId: e.EntryID,
    isPrivate: false,
    districtId: e.DistrictID,
    districtName: distMap[e.DistrictID] || e.DistrictID,
    zoneId: (data.districts.find(d => d.DistrictID === e.DistrictID) || {}).ZoneID || '',
    zoneName: distZoneMap[e.DistrictID] || '',
    fyId: e.FYID,
    fyLabel: fyMap[e.FYID] || e.FYID,
    projectId: e.ProjectID,
    projectName: projMap[e.ProjectID] || e.ProjectID,
    expectedSamples: Number(e.ExpectedSamples) || 0,
    parameterIds: parseParamIds(e.ParameterIDs),
    remarks: e.Remarks || '',
    status: e.Status || 'SUBMITTED',
    sendBackReason: e.SendBackReason || '',
    enteredBy: e.EnteredBy || '',
    enteredAt: e.EnteredAt || ''
  }));

  // Private sample submissions (from Chemist)
  const privEntries = (data.privateSampleEntries || []).map(e => ({
    entryId: e.EntryID,
    isPrivate: true,
    districtId: '',
    districtName: '-- (Zonal Private)',
    zoneId: e.ZoneID,
    zoneName: zoneMap[e.ZoneID] || e.ZoneID,
    fyId: e.FYID,
    fyLabel: fyMap[e.FYID] || e.FYID,
    clientType: e.ClientType,

function filterAdminSubmissions() {
  const distVal = (document.getElementById('submFilterDistrict') || {}).value || '';
  const fyVal = (document.getElementById('submFilterFY') || {}).value || '';
  const typeVal = (document.getElementById('submFilterType') || {}).value || '';
  const statusVal = (document.getElementById('submFilterStatus') || {}).value || '';
  const q = ((document.getElementById('submFilterKeyword') || {}).value || '').toLowerCase().trim();

  let visibleCount = 0;
  const items = document.querySelectorAll('.admin-subm-item');
  items.forEach(item => {
    const dMatch = !distVal || item.dataset.district === distVal;
    const fyMatch = !fyVal || item.dataset.fy === fyVal;
    const typeMatch = !typeVal || item.dataset.type === typeVal;
    const statusMatch = !statusVal || item.dataset.status === statusVal;
    const qMatch = !q || (item.dataset.search || '').includes(q);
    if (dMatch && fyMatch && typeMatch && statusMatch && qMatch) {
      item.style.display = '';
      visibleCount++;
    } else {
      item.style.display = 'none';
    }
  });

  const badge = document.getElementById('adminSubmCountBadge');
  if (badge) badge.textContent = `${visibleCount} Submissions Shown`;
}

function resetAdminSubmFilters() {
  const dSel = document.getElementById('submFilterDistrict'); if (dSel) dSel.value = '';
  const fySel = document.getElementById('submFilterFY'); if (fySel) fySel.value = '';
  const tSel = document.getElementById('submFilterType'); if (tSel) tSel.value = '';
  const sSel = document.getElementById('submFilterStatus'); if (sSel) sSel.value = '';
  const kw = document.getElementById('submFilterKeyword'); if (kw) kw.value = '';
  filterAdminSubmissions();
}

async function openSendBackPrompt(entryId) {
  const reason = prompt('এই Submission টি ফেরত পাঠানোর (Send Back) কারণ উল্লেখ করুন (যেমন: নমুনা সংখ্যা যাচাই প্রয়োজন / প্যারামিটার সংশোধন করতে হবে):', 'অ্যাডমিন কর্তৃক সংশোধনের জন্য ফেরত পাঠানো হয়েছে।');
  if (reason === null) return;
  if (!reason.trim()) {
    alert('অনুগ্রহ করে ফেরত পাঠানোর কারণ লিখুন।');
    return;
  }
  try {
    await gsr('adminSendBackEntry', entryId, reason.trim());
    ADMIN_ACTIVE_TAB = 'submissions';
    await renderAdminView(true);
    alert('এন্ট্রিটি সফলভাবে ফেরত পাঠানো (Sent Back) হয়েছে। এটি কেমিক্যাল ক্যালকুলেশন থেকে বাদ রাখা হয়েছে এবং সংশ্লিষ্ট ইউজার এটি সংশোধন করে পুনরায় জমা দিতে পারবেন।');
  } catch(err) {
    alert('Error: ' + err.message);
  }
}

function onNewRecipeChemChange() {

function editRecipeRow(rowId) {

  const chem = DB.chemicals.find(c => c.ChemicalID === pc.ChemicalID);
  row.classList.add('editing');
  row.querySelector('.rc-param').innerHTML = `<select id="er-param-${esc(rowId)}">${parameterOptions(DB.parameters, pc.ParameterID)}</select>`;

  if (display) display.textContent = chem ? chem.Unit : '';

async function saveRecipe(rowId) {

  if (!qty) return;

  const chem = DB.chemicals.find(c => c.ChemicalID === chemId);
  const unit = chem ? chem.Unit : '';
  await gsr('adminUpdateParameterChemical', rowId, paramId, chemId, qty, unit);
  renderAdminView(true);
}

  if (!confirmDelete(name + ' recipe row')) return;
  await gsr('adminDeleteParameterChemical', rowId);

function bindRecipeTab(data) {

function exportFullDatabaseExcel() {
  if (typeof XLSX === 'undefined') {
    alert('Excel library (SheetJS) is loading or unavailable. Please use JSON export.');
    return;
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(DB.zones || []), 'Zones');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(DB.districts || []), 'Districts');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(DB.users || []), 'Users');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(DB.parameters || []), 'Parameters');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(DB.chemicals || []), 'Chemicals');

  const recipeExport = (DB.parameterChemicals || []).map(r => ({
    RowID: r.RowID,
    ParameterID: r.ParameterID,
    ChemicalID: r.ChemicalID,
    QtyPerTest: r.QtyPerTest
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(recipeExport), 'ChemicalRecipes');

  const projectExport = (DB.projects || []).map(p => ({
    ProjectID: p.ProjectID,
    ProjectName: p.ProjectName,
    DistrictScope: (p.IsAllDistricts || p.DistrictID === 'ALL') ? 'ALL' : (Array.isArray(p.DistrictIDs) ? p.DistrictIDs.join(',') : p.DistrictID),
    FYID: p.FYID,
    CreatedAt: p.CreatedAt
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(projectExport), 'Projects');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(DB.fiscalYears || []), 'FiscalYears');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(DB.sampleEntries || []), 'SampleEntries');

  XLSX.writeFile(wb, `DPHE_Full_Backup_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

function processExcelSetupUpload() {
  const fileInput = document.getElementById('excelUploadFileInput');
  if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
    alert('অনুগ্রহ করে প্রথমে একটি এক্সেল (.xlsx / .xls) ফাইল নির্বাচন করুন।');
    return;
  }
  const file = fileInput.files[0];
  const modeEl = document.querySelector('input[name="excelImportMode"]:checked');
  const mode = modeEl ? modeEl.value : 'replace';

  if (typeof XLSX === 'undefined') {
    alert('Excel library (SheetJS) is unavailable. Please use JSON restore or verify your internet connection.');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const counts = [];

      function getSheetRows(sheetName) {
        const ws = workbook.Sheets[sheetName];
        if (!ws) return null;
        return XLSX.utils.sheet_to_json(ws);
      }

      const isReplace = mode === 'replace';

      // 1. Zones
      const zonesRows = getSheetRows('Zones');
      if (zonesRows && zonesRows.length > 0) {
        const cleaned = zonesRows.map(r => ({ ZoneID: String(r.ZoneID || genId('Z')).trim(), ZoneName: String(r.ZoneName || '').trim() }));
        if (isReplace) DB.zones = cleaned;
        else {
          cleaned.forEach(item => {
            const idx = DB.zones.findIndex(z => z.ZoneID === item.ZoneID);
            if (idx >= 0) DB.zones[idx] = item; else DB.zones.push(item);
          });
        }
        counts.push(`${cleaned.length}টি Zones`);
      }

      // 2. Districts
      const distRows = getSheetRows('Districts');
      if (distRows && distRows.length > 0) {
        const cleaned = distRows.map(r => ({ DistrictID: String(r.DistrictID || genId('D')).trim(), DistrictName: String(r.DistrictName || '').trim(), ZoneID: String(r.ZoneID || '').trim() }));
        if (isReplace) DB.districts = cleaned;
        else {
          cleaned.forEach(item => {
            const idx = DB.districts.findIndex(d => d.DistrictID === item.DistrictID);
            if (idx >= 0) DB.districts[idx] = item; else DB.districts.push(item);
          });
        }
        counts.push(`${cleaned.length}টি Districts`);
      }

      // 3. Users
      const usersRows = getSheetRows('Users');
      if (usersRows && usersRows.length > 0) {
        const cleaned = usersRows.map(r => ({
          Email: String(r.Email || '').trim().toLowerCase(),
          Name: String(r.Name || '').trim(),
          Role: String(r.Role || 'EXEN').trim().toUpperCase(),
          DistrictID: String(r.DistrictID || '').trim(),
          ZoneID: String(r.ZoneID || '').trim(),
          Active: r.Active === true || String(r.Active).toLowerCase() === 'true' || r.Active === 1
        }));
        if (isReplace) DB.users = cleaned;
        else {
          cleaned.forEach(item => {
            const idx = DB.users.findIndex(u => u.Email === item.Email);
            if (idx >= 0) DB.users[idx] = item; else DB.users.push(item);
          });
        }
        counts.push(`${cleaned.length}টি Users`);
      }

      // 4. Parameters
      const paramRows = getSheetRows('Parameters');
      if (paramRows && paramRows.length > 0) {
        const cleaned = paramRows.map(r => ({
          ParameterID: String(r.ParameterID || genId('P')).trim(),
          ParameterName: String(r.ParameterName || '').trim(),
          Unit: String(r.Unit || '').trim(),
          Category: String(r.Category || 'Chemical').trim()
        }));
        if (isReplace) DB.parameters = cleaned;
        else {
          cleaned.forEach(item => {
            const idx = DB.parameters.findIndex(p => p.ParameterID === item.ParameterID);
            if (idx >= 0) DB.parameters[idx] = item; else DB.parameters.push(item);
          });
        }
        counts.push(`${cleaned.length}টি Parameters`);
      }

      // 5. Chemicals
      const chemRows = getSheetRows('Chemicals');
      if (chemRows && chemRows.length > 0) {
        const cleaned = chemRows.map(r => ({
          ChemicalID: String(r.ChemicalID || genId('CH')).trim(),
          ChemicalName: String(r.ChemicalName || '').trim(),
          Unit: String(r.Unit || '').trim()
        }));
        if (isReplace) DB.chemicals = cleaned;
        else {
          cleaned.forEach(item => {
            const idx = DB.chemicals.findIndex(c => c.ChemicalID === item.ChemicalID);
            if (idx >= 0) DB.chemicals[idx] = item; else DB.chemicals.push(item);
          });
        }
        counts.push(`${cleaned.length}টি Chemicals`);
      }

      // 6. ChemicalRecipes
      const recipeRows = getSheetRows('ChemicalRecipes') || getSheetRows('Recipes');
      if (recipeRows && recipeRows.length > 0) {
        const chemMap = {}; DB.chemicals.forEach(c => chemMap[c.ChemicalID] = c.Unit);
        const cleaned = recipeRows.map(r => {
          const cId = String(r.ChemicalID || '').trim();
          return {
            RowID: String(r.RowID || genId('PC')).trim(),
            ParameterID: String(r.ParameterID || '').trim(),
            ChemicalID: cId,
            QtyPerTest: Number(r.QtyPerTest) || 0,
            Unit: chemMap[cId] || ''
          };
        });
        if (isReplace) DB.parameterChemicals = cleaned;
        else {
          cleaned.forEach(item => {
            const idx = DB.parameterChemicals.findIndex(pc => pc.RowID === item.RowID);
            if (idx >= 0) DB.parameterChemicals[idx] = item; else DB.parameterChemicals.push(item);
          });
        }
        counts.push(`${cleaned.length}টি Recipes`);
      }

      // 7. Projects
      const projRows = getSheetRows('Projects');
      if (projRows && projRows.length > 0) {
        const cleaned = projRows.map(r => {
          const scope = String(r.DistrictScope || r.DistrictIDs || r.DistrictID || 'ALL').trim();
          const isAll = scope.toUpperCase() === 'ALL';
          const distList = isAll ? ['ALL'] : scope.split(',').map(s => s.trim()).filter(Boolean);
          return {
            ProjectID: String(r.ProjectID || genId('PRJ')).trim(),
            ProjectName: String(r.ProjectName || '').trim(),
            DistrictIDs: distList,
            DistrictID: isAll ? 'ALL' : distList.join(','),
            IsAllDistricts: isAll,
            FYID: String(r.FYID || '').trim(),
            CreatedAt: String(r.CreatedAt || nowStr()).trim()
          };
        });
        if (isReplace) DB.projects = cleaned;
        else {
          cleaned.forEach(item => {
            const idx = DB.projects.findIndex(p => p.ProjectID === item.ProjectID);
            if (idx >= 0) DB.projects[idx] = item; else DB.projects.push(item);
          });
        }
        counts.push(`${cleaned.length}টি Projects`);
      }

      // 8. FiscalYears
      const fyRows = getSheetRows('FiscalYears');
      if (fyRows && fyRows.length > 0) {
        const cleaned = fyRows.map(r => ({
          FYID: String(r.FYID || genId('FY')).trim(),
          FYLabel: String(r.FYLabel || '').trim(),
          IsActive: r.IsActive === true || String(r.IsActive).toLowerCase() === 'true' || r.IsActive === 1
        }));
        if (isReplace) DB.fiscalYears = cleaned;
        else {
          cleaned.forEach(item => {
            const idx = DB.fiscalYears.findIndex(f => f.FYID === item.FYID);
            if (idx >= 0) DB.fiscalYears[idx] = item; else DB.fiscalYears.push(item);
          });
        }
        counts.push(`${cleaned.length}টি Fiscal Years`);
      }

      // 9. SampleEntries (if present in full backup)
      const sampleRows = getSheetRows('SampleEntries');
      if (sampleRows && sampleRows.length > 0) {
        const cleaned = sampleRows.map(r => ({
          EntryID: String(r.EntryID || genId('SE')).trim(),
          FYID: String(r.FYID || '').trim(),
          DistrictID: String(r.DistrictID || '').trim(),
          ProjectID: String(r.ProjectID || '').trim(),
          ExpectedSamples: Number(r.ExpectedSamples) || 0,
          ParameterIDs: String(r.ParameterIDs || '').trim(),
          Remarks: String(r.Remarks || '').trim(),
          EnteredBy: String(r.EnteredBy || '').trim(),
          EnteredAt: String(r.EnteredAt || nowStr()).trim()
        }));
        if (isReplace) DB.sampleEntries = cleaned;
        else {
          cleaned.forEach(item => {
            const idx = DB.sampleEntries.findIndex(se => se.EntryID === item.EntryID);
            if (idx >= 0) DB.sampleEntries[idx] = item; else DB.sampleEntries.push(item);
          });
        }
        counts.push(`${cleaned.length}টি Sample Entries`);
      }

      saveDB(DB);
      renderAdminView(true);
      alert('✓ এক্সেল সেটআপ সফলভাবে লোড হয়েছে!\n\nলোডেড রেকর্ডসমূহ:\n• ' + (counts.join('\n• ') || 'কোনো ভ্যালিড শিট পাওয়া যায়নি।'));
    } catch (err) {
      alert('Error reading Excel file: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function exportDatabaseJSON() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `DPHE_Database_Backup_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
}

function triggerJSONRestore() {
  const fileInput = document.getElementById('jsonUploadFileInput');
  if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
    alert('অনুগ্রহ করে একটি JSON ব্যাকআপ ফাইল নির্বাচন করুন।');
    return;
  }
  const file = fileInput.files[0];
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.zones || !parsed.districts) throw new Error('Invalid DPHE database JSON format');
      DB = parsed;
      saveDB(DB);
      renderAdminView(true);
      alert('✓ JSON ব্যাকআপ সফলভাবে রিস্টোর হয়েছে!');
    } catch(err) {
      alert('Error importing JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function bindBackupTab(data) {
  const btn = document.getElementById('executeExcelImportBtn');
  if (btn) btn.addEventListener('click', processExcelSetupUpload);
}

    handleLogout();
    return;
  }
  document.getElementById('userNameDisplay').textContent = CURRENT_USER.name || CURRENT_USER.email;
  document.getElementById('roleBadgeDisplay').textContent = CURRENT_USER.role;
  ['exenView', 'chemistView', 'adminView'].forEach(id => document.getElementById(id).style.display = 'none');
  if (CURRENT_USER.role === 'EXEN') {
    document.getElementById('exenView').style.display = 'block';
    renderExenView();
  } else if (CURRENT_USER.role === 'CHEMIST') {
    document.getElementById('chemistView').style.display = 'block';
    renderChemistView();
  } else if (CURRENT_USER.role === 'ADMIN') {
    document.getElementById('adminView').style.display = 'block';
    renderAdminView(true);
  }
});
